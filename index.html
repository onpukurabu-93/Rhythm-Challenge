<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>リズムカード</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 15px 10px;
    }
    .active { display: flex; }

    .menu-title { font-size: 32px; font-weight: bold; color: #333; margin-top: 20px; }
    .level-list { width: 90%; max-width: 340px; display: flex; flex-direction: column; gap: 15px; }
    .level-btn {
      background: #ffffff;
      border: 4px solid #4ea8de;
      padding: 18px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .header-title { font-size: 26px; font-weight: bold; color: #333; margin: 0; text-align: center; }
    .swiper-container { width: 100%; height: 42vh; display: flex; align-items: center; justify-content: center; }
    .card-container { width: 85vw; max-width: 320px; height: 100%; max-height: 350px; perspective: 1000px; cursor: pointer; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.12); border-radius: 24px; }
    .card-container.flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; background: #ffffff; display: flex; align-items: center; justify-content: center; border: 4px solid #e2e8f0; box-sizing: border-box; }
    .card-back { transform: rotateY(180deg); }
    .card-img { width: 85%; height: 85%; object-fit: contain; }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-15px); }
      40% { transform: translateX(15px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: shake 0.4s ease; }

    .overlay {
      position: absolute;
      font-size: 140px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .overlay.correct { color: #2ed573; opacity: 1; }
    .overlay.wrong { color: #ff4757; opacity: 1; }

    .btn-menu {
      background: #a4b0be;
      color: white;
      border: none;
      padding: 8px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }

    .answer-display {
      font-size: 26px;
      font-weight: bold;
      color: #2d3748;
      background: #ffffff;
      border: 3px solid #cbd5e0;
      padding: 8px 20px;
      border-radius: 15px;
      min-width: 180px;
      min-height: 38px;
      text-align: center;
      margin-top: 5px;
    }

    /* ボタンエリアのスタイル */
    .keyboard-area {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 10px;
    }

    .length-buttons {
      display: flex;
      justify-content: space-between;
      gap: 5px;
    }

    .btn-len {
      flex: 1;
      background: #4ea8de;
      color: white;
      border: none;
      padding: 12px 2px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #3a86b7;
      touch-action: manipulation;
    }
    .btn-len.selected {
      background: #ff7f50;
      box-shadow: 0 4px 0 #e05627;
      transform: translateY(2px);
    }

    .type-buttons {
      display: flex;
      justify-content: center;
    }

    .btn-type {
      width: 80%;
      background: #2ed573;
      color: white;
      border: none;
      padding: 14px 0;
      font-size: 22px;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 4px 0 #26af5f;
      touch-action: manipulation;
    }
    .btn-type:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #26af5f;
    }

    .score-box {
      font-size: 18px;
      font-weight: bold;
      color: #4a5568;
    }
  </style>
</head>
<body>

  <!-- 1. メニュー画面 -->
  <div id="screenMenu" class="screen active">
    <h1 class="menu-title">リズムのおんがく</h1>
    <div class="level-list">
      <div class="level-btn" onclick="startLevel(1)">
        <span>Lv.1 おんぷ</span>
        <span>🔓</span>
      </div>
      <div class="level-btn" id="btnLv2" style="opacity: 0.5;" onclick="startLevel(2)">
        <span>Lv.2 きゅうふ</span>
        <span id="lockLv2">🔒</span>
      </div>
      <div class="level-btn" id="btnLv3" style="opacity: 0.5;" onclick="startLevel(3)">
        <span>Lv.3 ふてん</span>
        <span id="lockLv3">🔒</span>
      </div>
    </div>
    <div></div>
  </div>

  <!-- 2. 練習モード -->
  <div id="screenPractice" class="screen">
    <div style="text-align:center;">
      <h1 class="header-title" id="practiceTitle">Lv.1 れんしゅう</h1>
    </div>
    <div class="swiper-container" id="swipeArea">
      <div class="card-container" id="cardContainer" onclick="flipCard()">
        <div class="card-inner" id="cardInner">
          <div class="card-front"><img id="imgFront" class="card-img" src="" alt="おもて"></div>
          <div class="card-back"><img id="imgBack" class="card-img" src="" alt="うら"></div>
        </div>
      </div>
    </div>
    <div style="text-align: center; margin-bottom: 20px;">
      <button class="btn-len" style="padding:12px 24px; font-size:20px;" onclick="startTraining()">🎮 トレーニング</button><br><br>
      <button class="btn-menu" onclick="showMenu()">もどる</button>
    </div>
  </div>

  <!-- 3. トレーニングモード -->
  <div id="screenTraining" class="screen">
    <div style="text-align:center; width:100%;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:0 10px;">
        <button class="btn-menu" onclick="stopTrainingAndGoMenu()">おわる</button>
        <div id="scoreBox" class="score-box">1 / 10 もんめ</div>
      </div>
      <div id="answerDisplay" class="answer-display">えらんでね</div>
    </div>

    <div class="swiper-container" style="position: relative;">
      <div class="card-container" id="quizCardContainer">
        <div class="card-inner" id="quizCardInner">
          <div class="card-front"><img id="quizImg" class="card-img" src="" alt="問題"></div>
        </div>
      </div>
      <div id="markOverlay" class="overlay"></div>
    </div>

    <!-- 2段階選択キーボード -->
    <div class="keyboard-area">
      <div class="length-buttons">
        <button class="btn-len" onclick="selectLength('ぜん', this)">ぜん</button>
        <button class="btn-len" onclick="selectLength('2ぶ', this)">2ぶ</button>
        <button class="btn-len" onclick="selectLength('4ぶ', this)">4ぶ</button>
        <button class="btn-len" onclick="selectLength('8ぶ', this)">8ぶ</button>
        <button class="btn-len" onclick="selectLength('16ぶ', this)">16ぶ</button>
      </div>
      <div class="type-buttons">
        <button class="btn-type" onclick="submitAnswer('おんぷ')">おんぷ</button>
      </div>
    </div>
  </div>

  <script>
    const cards = [
      { id: '4bu', length: '4ぶ', type: 'おんぷ', front: 'onpu5-4bu1.png', back: 'onpu5-4bu2.png' },
      { id: '2bu', length: '2ぶ', type: 'おんぷ', front: 'onpu3-2bu1.png', back: 'onpu3-2bu2.png' },
      { id: 'zen', length: 'ぜん', type: 'おんぷ', front: 'onpu1-zen1.png', back: 'onpu1-zen2.png' },
      { id: '8bu', length: '8ぶ', type: 'おんぷ', front: 'onpu7-8bu1.png', back: 'onpu7-8bu2.png' },
      { id: '16bu', length: '16ぶ', type: 'おんぷ', front: 'onpu10-16bu1.png', back: 'onpu10-16bu2.png' }
    ];

    let currentLevel = 1;
    let unlockedLevel = 1;

    let currentIndex = 0;
    let quizIndex = -1;
    let lastQuizIndex = -1;
    let selectedLength = '';

    let questionCount = 0;
    let correctCount = 0;
    let totalQuestions = 10;
    let isChecking = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (type === 'tap') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'correct') {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        const gain2 = audioCtx.createGain();

        osc1.connect(gain1); gain1.connect(audioCtx.destination);
        osc2.connect(gain2); gain2.connect(audioCtx.destination);

        osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc2.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);

        osc1.start(audioCtx.currentTime); osc1.stop(audioCtx.currentTime + 0.3);
        osc2.start(audioCtx.currentTime + 0.15); osc2.stop(audioCtx.currentTime + 0.55);
      } else if (type === 'wrong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function showScreen(id) {
      playSound('tap');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showMenu() { showScreen('screenMenu'); }

    function startLevel(lv) {
      if (lv > unlockedLevel) return;
      currentLevel = lv;
      document.getElementById('practiceTitle').innerText = `Lv.${lv} れんしゅう`;
      showScreen('screenPractice');
      currentIndex = 0;
      updatePracticeCard();
    }

    function updatePracticeCard() {
      const container = document.getElementById('cardContainer');
      container.classList.remove('flipped');
      setTimeout(() => {
        document.getElementById('imgFront').src = cards[currentIndex].front;
        document.getElementById('imgBack').src = cards[currentIndex].back;
      }, 150);
    }
    function flipCard() { playSound('tap'); document.getElementById('cardContainer').classList.toggle('flipped'); }

    let startX = 0;
    const swipeArea = document.getElementById('swipeArea');
    swipeArea.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
    swipeArea.addEventListener('touchend', e => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) {
        currentIndex = diff > 0 ? (currentIndex + 1) % cards.length : (currentIndex - 1 + cards.length) % cards.length;
        updatePracticeCard();
      }
    });

    function startTraining() {
      questionCount = 0;
      correctCount = 0;
      lastQuizIndex = -1;
      showScreen('screenTraining');
      nextQuestion();
    }

    function nextQuestion() {
      if (questionCount >= totalQuestions) {
        finishTraining();
        return;
      }

      questionCount++;
      isChecking = false;
      selectedLength = '';
      resetButtons();
      document.getElementById('scoreBox').innerText = `${questionCount} / ${totalQuestions} もんめ`;
      document.getElementById('answerDisplay').innerText = "えらんでね";

      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * cards.length);
      } while (cards.length > 1 && newIndex === lastQuizIndex);

      quizIndex = newIndex;
      lastQuizIndex = quizIndex;

      document.getElementById('quizImg').src = cards[quizIndex].front;
    }

    // 長さ（ぜん・2ぶ 等）を選択
    function selectLength(len, btn) {
      if (isChecking) return;
      playSound('tap');
      selectedLength = len;
      
      document.querySelectorAll('.btn-len').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      document.getElementById('answerDisplay').innerText = `${selectedLength} ...`;
    }

    // 「おんぷ」を押して最終判定
    function submitAnswer(type) {
      if (isChecking) return;
      playSound('tap');

      if (!selectedLength) {
        document.getElementById('answerDisplay').innerText = "ながさをえらんでね";
        return;
      }

      isChecking = true;
      const fullAnswer = selectedLength + type;
      document.getElementById('answerDisplay').innerText = fullAnswer;

      const card = cards[quizIndex];
      const isCorrect = (selectedLength === card.length && type === card.type);

      const overlay = document.getElementById('markOverlay');
      const cardInner = document.getElementById('quizCardInner');

      if (isCorrect) {
        correctCount++;
        overlay.innerText = '⭕️';
        overlay.className = 'overlay correct';
        playSound('correct');

        setTimeout(() => {
          overlay.className = 'overlay';
          nextQuestion();
        }, 1500);

      } else {
        overlay.innerText = '❌';
        overlay.className = 'overlay wrong';
        cardInner.classList.add('shake');
        playSound('wrong');

        setTimeout(() => {
          overlay.className = 'overlay';
          cardInner.classList.remove('shake');
          isChecking = false;
        }, 1200);
      }
    }

    function resetButtons() {
      document.querySelectorAll('.btn-len').forEach(b => b.classList.remove('selected'));
    }

    function finishTraining() {
      const passRate = (correctCount / totalQuestions) * 100;

      if (passRate >= 90) {
        alert(`すごい！ ${totalQuestions}もんちゅう ${correctCount}もん せいかい！\nクリアおめでとう！🎉`);
      } else {
        alert(`${totalQuestions}もんちゅう ${correctCount}もん せいかい！\nもう一度チャレンジしよう！`);
      }
      showMenu();
    }

    function stopTrainingAndGoMenu() { showMenu(); }
  </script>
</body>
</html>
