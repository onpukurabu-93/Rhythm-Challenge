<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>リズムカード - レベル1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }
    
    .header {
      padding-top: 15px;
      text-align: center;
    }
    .header h1 { font-size: 20px; color: #333; margin: 0; }
    .header p { font-size: 13px; color: #666; margin: 5px 0 0; }

    /* 横スワイプ用コンテナ */
    .swiper-container {
      width: 100%;
      height: 65vh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }

    .card-container {
      width: 85vw;
      max-width: 360px;
      height: 100%;
      max-height: 420px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease, opacity 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      border-radius: 24px;
    }

    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #e2e8f0;
      box-sizing: border-box;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .card-img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    .footer {
      padding-bottom: 25px;
      text-align: center;
    }

    .counter {
      font-size: 16px;
      font-weight: bold;
      color: #4a5568;
      background: #e2e8f0;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Lv.1 おんぷ・きゅうふ</h1>
    <p>左右にスワイプで切り替え / タップでめくる</p>
  </div>

  <div class="swiper-container" id="swipeArea">
    <div class="card-container" id="cardContainer" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-front">
          <img id="imgFront" class="card-img" src="" alt="おもて">
        </div>
        <div class="card-back">
          <img id="imgBack" class="card-img" src="" alt="うら">
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="counter" id="cardCounter">1 / 10</div>
  </div>

  <script>
    const cards = [
      { front: 'onpu1-zen1.png', back: 'onpu1-zen2.png' },
      { front: 'onpu3-2bu1.png', back: 'onpu3-2bu2.png' },
      { front: 'onpu5-4bu1.png', back: 'onpu5-4bu2.png' },
      { front: 'onpu7-8bu1.png', back: 'onpu7-8bu2.png' },
      { front: 'onpu10-16bu1.png', back: 'onpu10-16bu2.png' },
      { front: 'kyuufu1-zen1.png', back: 'kyuufu1-zen2.png' },
      { front: 'kyuufu3-2bu1.png', back: 'kyuufu3-2bu2.png' },
      { front: 'kyuufu5-4bu1.png', back: 'kyuufu5-4bu2.png' },
      { front: 'kyuufu7-8bu1.png', back: 'kyuufu7-8bu2.png' },
      { front: 'kyuufu9-16bu1.png', back: 'kyuufu9-16bu3.png' }
    ];

    let currentIndex = 0;
    const container = document.getElementById('cardContainer');
    const inner = document.getElementById('cardInner');
    const imgFront = document.getElementById('imgFront');
    const imgBack = document.getElementById('imgBack');
    const counter = document.getElementById('cardCounter');

    function updateCard() {
      container.classList.remove('flipped');
      setTimeout(() => {
        imgFront.src = cards[currentIndex].front;
        imgBack.src = cards[currentIndex].back;
        counter.innerText = `${currentIndex + 1} / ${cards.length}`;
      }, 150);
    }

    function flipCard() {
      container.classList.toggle('flipped');
    }

    // スワイプ処理（タッチ・マウス両対応）
    let startX = 0;
    let isSwiping = false;
    const swipeArea = document.getElementById('swipeArea');

    swipeArea.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      isSwiping = true;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
      if (!isSwiping) return;
      const endX = e.changedTouches[0].clientX;
      handleSwipe(startX, endX);
      isSwiping = false;
    });

    // マウスドラッグ対応（PC等用）
    swipeArea.addEventListener('mousedown', (e) => {
      startX = e.clientX;
      isSwiping = true;
    });

    swipeArea.addEventListener('mouseup', (e) => {
      if (!isSwiping) return;
      const endX = e.clientX;
      handleSwipe(startX, endX);
      isSwiping = false;
    });

    function handleSwipe(start, end) {
      const diff = start - end;
      if (Math.abs(diff) > 40) { // 40px以上の動かすとカード切り替え
        if (diff > 0) {
          // 左スワイプ ➔ つぎのカード
          currentIndex = (currentIndex + 1) % cards.length;
        } else {
          // 右スワイプ ➔ まえのカード
          currentIndex = (currentIndex - 1 + cards.length) % cards.length;
        }
        updateCard();
      }
    }

    // 初回読み込み
    updateCard();
  </script>
</body>
</html>
