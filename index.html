<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リズムカード - レベル1</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background-color: #f7f9fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 90vh;
      box-sizing: border-box;
    }
    .header { text-align: center; }
    .header h1 { font-size: 24px; color: #333; margin: 0 0 5px; }
    .header p { font-size: 14px; color: #666; margin: 0; }
    
    /* カードの立体回転アニメーション */
    .card-container {
      width: 280px;
      height: 280px;
      perspective: 1000px;
      margin: 20px 0;
      cursor: pointer;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      border-radius: 20px;
    }
    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #e0e0e0;
      box-sizing: border-box;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .card-img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 10px;
    }
    .btn {
      background-color: #ff6b6b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-next {
      background-color: #4ea8de;
    }
    .hint {
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>レベル1：おんぷのお名前と長さ</h1>
    <p>カードをタップすると「うら」が見えるよ！</p>
  </div>

  <!-- カードエリア -->
  <div class="card-container" id="cardContainer" onclick="flipCard()">
    <div class="card-inner">
      <div class="card-front">
        <img id="imgFront" class="card-img" src="onpu5-4bu1.png" alt="おんぷ（おもて）">
      </div>
      <div class="card-back">
        <img id="imgBack" class="card-img" src="onpu5-4bu2.png" alt="おんぷ（うら）">
      </div>
    </div>
  </div>

  <div class="hint" id="hintText">👆 タップしてうら（答え）をみてみよう</div>

  <!-- 操作ボタン -->
  <div class="controls">
    <button class="btn" onclick="flipCard()">めくる</button>
    <button class="btn btn-next" onclick="nextCard()">つぎのカード</button>
  </div>

  <script>
    // レベル1で使うカードデータのリスト（おもて画像, うら画像）
    const cards = [
      { front: 'onpu5-4bu1.png', back: 'onpu5-4bu2.png' }, // 4分音符
      { front: 'onpu3-2bu1.png', back: 'onpu3-2bu2.png' }, // 2分音符
      { front: 'onpu1-zen1.png', back: 'onpu1-zen2.png' }, // 全音符
      { front: 'onpu7-8bu1.png', back: 'onpu7-8bu2.png' }  // 8分音符
    ];

    let currentIndex = 0;
    const container = document.getElementById('cardContainer');
    const imgFront = document.getElementById('imgFront');
    const imgBack = document.getElementById('imgBack');

    // カードをめくる関数
    function flipCard() {
      container.classList.toggle('flipped');
    }

    // 次のカードに進む関数
    function nextCard() {
      // 一旦表に戻してから切り替え
      container.classList.remove('flipped');
      
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % cards.length;
        imgFront.src = cards[currentIndex].front;
        imgBack.src = cards[currentIndex].back;
      }, 300);
    }
  </script>
</body>
</html>
