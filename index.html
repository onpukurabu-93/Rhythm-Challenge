<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>リズムチャレンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ea;--ink:#3b2f2a;--sub:#8a7a70;--card:#fff;--line:#eadcc8;
  --c1:#ec6450;--c2:#eaa317;--c3:#4fb172;--c4:#3f92dc;--c8:#f07f2e;--c16:#d4609f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100vh}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:2px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:800;flex:1;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo{display:inline-flex;gap:2px}
.logo i{display:block;width:12px;height:16px;border-radius:3px}
#backBtn{border:none;background:#fff;border-radius:14px;width:48px;height:44px;font-size:24px;
  box-shadow:0 3px 0 var(--line);visibility:hidden}
#stars{font-weight:800;font-size:18px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 var(--line)}
.view{display:none;max-width:780px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
.view.on{display:block}
h2{font-size:22px;margin:6px 0 12px}
.hint{color:var(--sub);font-size:14px;margin:4px 0 12px}

/* home */
.tiles{display:grid;gap:14px}
.tile{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:26px;border:none;
  font-size:24px;font-weight:800;color:#fff;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .em{font-size:44px;line-height:1}
.tile small{display:block;font-size:14px;font-weight:500;opacity:.95;margin-top:2px}
.tile.soon{background:#e3d8c8 !important;color:#8a7a70;box-shadow:none;cursor:default}
.settings{margin-top:22px;background:#fff;border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:0 3px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .lab{min-width:96px;font-weight:800}
.seg{display:inline-flex;background:#f3eadc;border-radius:14px;padding:3px}
.seg button{border:none;background:none;padding:8px 14px;border-radius:11px;font-weight:800;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:none;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px;
  box-shadow:0 3px 0 var(--line);color:var(--sub)}
#nbChips .chip{font-size:14px;padding:7px 11px}
.chip.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:none;border-radius:20px;padding:12px 10px 14px;box-shadow:0 4px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .1s}
.card:active{transform:scale(.97)}
.card .w{font-size:20px;font-weight:800}
.card .emj{font-size:26px;line-height:1}
.card svg{max-width:100%;height:auto}
.card svg,.qchoice svg,.bn-pc svg{height:calc(var(--vh,72) / 72 * 58px) !important;width:auto !important;max-width:none !important}

/* blocks */
.blocks{display:flex;align-items:flex-end;justify-content:center}
.ev{display:flex;gap:2px;margin:0 3px}
.blk{flex:none;width:calc(var(--u)*var(--d) - 2px);height:var(--bh,var(--u));border-radius:calc(min(var(--u),95px)*.12);
  background:var(--c);border:2px solid rgba(0,0,0,.14);border-bottom-width:5px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  font-size:calc(var(--u)*.27*min(1,var(--d)*1.7));text-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:opacity .12s,transform .12s;white-space:nowrap;overflow:hidden}
.blk.rest{background:#fff;border:3px dashed var(--c);color:var(--c);text-shadow:none}
.nolabel .blk,.nolabel .blk.long{font-size:0}
.playing .blk[data-t]{opacity:.28}
.playing .blk[data-t].on{opacity:1;transform:translateY(calc(var(--u)*-.1))}
.blk.long{background:transparent;padding:0;align-items:stretch;justify-content:stretch;font-size:calc(var(--u)*.27);border-color:rgba(0,0,0,.18)}
.blk.long .bt{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--c);transition:opacity .12s}
.blk.long .bt+.bt{border-left:2px solid rgba(255,255,255,.4)}
.blk.long.rest{background:#fff}
.blk.long.rest .bt{background:#fff}
.blk.long.rest .bt+.bt{border-left:2px dashed color-mix(in srgb,var(--c) 35%,transparent)}
.playing .blk.long .bt{opacity:.28}
.playing .blk.long .bt.on{opacity:1}

/* detail */
.detail{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.detail .notebox{background:#fff;border-radius:22px;padding:8px 14px;box-shadow:0 4px 0 var(--line);width:100%;display:flex;justify-content:center}
.detail .emj{font-size:40px;line-height:1}
.pic{display:block;object-fit:contain;height:1.5em;width:auto;max-width:5em;margin:0 auto}
.detail .emj .pic{height:min(90px,12vh)}
.notebox svg,.nb-top svg{max-height:min(84px,11vh);width:auto !important}
.notebox svg{max-height:min(104px,14vh)}
.detail .word{font-size:32px;font-weight:800;letter-spacing:.04em}
.pager{display:flex;align-items:center;gap:14px;margin-top:4px}.arw{border:none;background:#fff;border-radius:14px;width:52px;height:44px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.dots{display:flex;gap:7px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#e2d5c2}.dots i.on{background:var(--ink)}
.tanrow{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:6px}
.tancap{font-size:14px;font-weight:800;color:var(--sub)}.tancap b{font-size:20px;color:var(--c1)}
.qnum .w{font-size:44px}.qnum{min-height:90px}
.sylNow{height:56px;font-size:46px;font-weight:800;color:var(--c4)}
.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dbtns{flex-wrap:nowrap;gap:8px}.dbtns .bigbtn{padding:11px 13px;font-size:17px;white-space:nowrap}
.bigbtn{border:none;border-radius:18px;padding:12px 18px;font-size:19px;font-weight:800;color:#fff;
  background:var(--c4);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bigbtn.gray{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}

/* nobashi */
.nb-top{display:flex;flex-direction:column;align-items:center;gap:8px}
.track{position:relative;margin:10px auto 0;height:calc(var(--u)*.8)}
.track .slot{position:absolute;top:0;height:100%;width:calc(var(--u) - 4px);border-radius:calc(var(--u)*.12);
  border:3px dashed #d8cbb8;display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:calc(var(--u)*.27);color:transparent;z-index:2;transition:color .1s}
.track.hint .slot.tg{border:3px solid var(--c);border-style:dashed}
.track .slot.extra{border-color:#eee2d2}
.track .slot.passed{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.track .slot.passed.extra{color:#b9a995}
.track .fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:calc(var(--u)*.12);background:var(--c);z-index:1}
.track.reach .slot.tg{border-color:#fff;border-style:solid;animation:glow .5s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 5px rgba(79,177,114,.55)}}
.nb-msg{min-height:58px;font-size:22px;font-weight:800;text-align:center;margin:8px 0 6px}
.nb-msg small{display:block;font-size:16px;color:var(--sub);font-weight:500}
.holdwrap{display:flex;justify-content:center;margin:6px 0 16px}
.hold{width:min(50vw,200px,25vh);height:min(50vw,200px,25vh);border-radius:50%;border:none;color:#fff;font-size:30px;font-weight:800;
  background:radial-gradient(circle at 35% 30%,#ff9a85,var(--c1));box-shadow:0 10px 0 #b8432f;touch-action:none;
  transition:transform .06s}
.hold.down{transform:translateY(8px) scale(.97);box-shadow:0 2px 0 #b8432f}
.hold.count{background:radial-gradient(circle at 35% 30%,#8ec5f2,var(--c4));box-shadow:0 10px 0 #2b6ca8;font-size:56px}
.nb-sylnow{height:52px;font-size:44px;font-weight:800;text-align:center;color:var(--ink)}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tog{border:none;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 3px 0 var(--line);color:var(--sub)}
.tog.on{color:var(--ink)}
.tog .box{display:inline-block;width:20px;height:20px;border-radius:6px;border:2px solid #cbbba6;vertical-align:-4px;margin-right:6px}
.tog.on .box{background:var(--c3);border-color:var(--c3)}

/* quiz */
.qtypes{display:grid;gap:12px;margin-bottom:16px}
.qtype{display:flex;align-items:center;gap:14px;border:3px solid transparent;background:#fff;border-radius:20px;padding:14px;
  text-align:left;box-shadow:0 4px 0 var(--line);font-size:20px;font-weight:800}
.qtype .em{font-size:36px}
.qtype small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.qtype.on{border-color:var(--ink)}
.qprompt{text-align:center;font-size:26px;font-weight:800;margin:6px 0 10px}
.qprog{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.qprog i{width:14px;height:14px;border-radius:50%;background:#e6dac8}
.qprog i.done{background:var(--c2)}
.qprog i.now{background:var(--ink)}
.qnote{display:flex;justify-content:center;background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.qchoices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.qchoice{background:#fff;border:4px solid transparent;border-radius:22px;padding:14px 8px;box-shadow:0 4px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px;justify-content:center}
.qchoice .w{font-size:26px;font-weight:800}
.qchoice.lit{border-color:var(--c4)}
.qchoice.good{border-color:var(--c3);background:#eaf8ef}
.qchoice.bad{animation:shake .4s}
.qchoice[disabled]{opacity:1}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.result{text-align:center;padding:30px 0}
.result .big{font-size:64px}
.result .t{font-size:30px;font-weight:800;margin:10px 0 24px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.ov span{font-size:160px;animation:pop .35s}
/* bento */
.bento{position:relative;margin:4px auto 0;background:#fff;border:5px solid #c98b4a;border-radius:22px;padding:8px;box-shadow:0 5px 0 #a8703a}
.bento .cells{position:absolute;inset:8px;display:flex;pointer-events:none}
.bento .cell{flex:1;border-right:2px dashed #ead6bd}
.bento .cell:last-child{border-right:none}
.bento .lay{position:relative;display:flex;align-items:center;height:100%}
.bento .ghost{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;opacity:.45}
.bento .ghost .blk{border-style:dashed}
.bento .gh{position:absolute;top:0;height:100%;border:3px dashed var(--c);border-radius:12px;opacity:.55;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.04) 6px 12px)}
.bento .gh.r{background:none}
.bento .pc{display:flex;gap:2px;cursor:pointer;position:relative;z-index:2}
.bento .pc .blk{transition:transform .15s}
.bn-note{display:flex;justify-content:center;min-height:40px;margin-top:8px}
.bn-note svg{max-height:min(80px,11vh);width:auto !important}
.bn-target{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:18px;padding:8px;box-shadow:0 3px 0 var(--line);margin-bottom:8px}
.bn-target svg{max-height:min(80px,11vh);width:auto !important}
.bn-msg{min-height:30px;text-align:center;font-size:20px;font-weight:800;margin-bottom:6px}
.bn-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.bn-pc{background:#fff;border:none;border-radius:18px;padding:8px 6px 10px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.bn-pc:active{transform:scale(.96)}
.bn-pc .w{font-size:15px;font-weight:800}
.bn-pc svg{max-width:100%;height:auto}
.bn-pc.no{opacity:.35}
.bn-pc.bad,.bento.bad{animation:shake .4s}
.bento.good{border-color:var(--c3);box-shadow:0 5px 0 #2f7d4c}
.modal{position:fixed;inset:0;background:rgba(40,30,25,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal.on{display:flex}
i.lb{font-style:normal}
.qchoice.plainn svg{height:92px!important;width:auto!important;max-width:100%}
.qtapnote{position:relative}
.qtapnote .hfing{position:absolute;right:8%;top:50%;margin-top:-34px;font-size:56px;line-height:1;opacity:0;pointer-events:none}
.qtapnote.hglow{animation:hglow 1.1s ease-in-out 3}.qtapnote.hglow1{animation:hglow 1.1s ease-in-out 1}
.qtapnote.hglow .hfing{animation:hfing .55s ease-in-out 6 alternate}.qtapnote.hglow1 .hfing{animation:hfing .55s ease-in-out 2 alternate}
@keyframes hglow{50%{box-shadow:0 0 0 6px #ffd27a,0 0 22px 6px #ffcf6e}}
@keyframes hfing{from{opacity:1;transform:translateX(0)}to{opacity:1;transform:translateX(-16px)}}
.acc{background:#fff;border-radius:20px;margin:10px 0;box-shadow:0 3px 0 var(--line,#e8dccb);overflow:hidden}
.acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-size:20px;font-weight:800;background:none;border:0;color:var(--ink)}
.acc-h i{font-style:normal;transition:transform .2s;color:var(--sub)}.acc.open .acc-h i{transform:rotate(180deg)}
.acc-b{display:none;padding:0 12px 14px}.acc.open .acc-b{display:block}
.grpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grpbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--bg);border:2px solid #efe3d2;font-weight:800;color:var(--ink)}
.grpbtn .gi{font-size:34px}.grpbtn .gn{font-size:17px}.grpbtn .gp{font-size:12px;color:var(--sub);text-align:center}.grpbtn.opt{border-style:dashed}
.qmini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.qmini .tog{font-size:14px}
.grp-top{display:flex;align-items:center;gap:12px;justify-content:center;margin:4px 0}.grp-top .gi{font-size:46px}.grp-top .gn{font-size:24px;font-weight:800}.grp-top .gp{font-size:13px;color:var(--sub)}
.hzun{text-align:center}.zunb{background:#eaf6df;border:2px solid #b9dc9c;border-radius:18px;padding:10px 14px;font-weight:800;font-size:16px;color:#3d6b26;margin:4px 0 8px;line-height:1.5}
.sy-dots{display:flex;gap:5px;justify-content:center;margin:4px 0}.sy-dots i{width:9px;height:9px;border-radius:50%;background:#e6dccd}.sy-dots i.ok{background:var(--c3)}.sy-dots i.now{background:var(--c1);transform:scale(1.3)}
.sy-name{text-align:center;font-size:34px;font-weight:900;color:var(--c1);min-height:46px}.sy-name.pop{animation:pop .5s}
.sy-stage,.sy-rh{display:flex;justify-content:center}.sy-note{max-width:78vw;max-height:36vh;height:auto;touch-action:none}
.sy-note .hid{opacity:0}#syHeadG.pop{animation:syIn .8s cubic-bezier(.3,1.5,.6,1)}@keyframes syIn{from{transform:scale(.2);opacity:0;transform-origin:130px 118px}}
.sy-ghost{fill:none;stroke:#e8774f;stroke-width:4;stroke-dasharray:6 8;opacity:.8}
#syStem{stroke-dasharray:120;stroke-dashoffset:0;transition:stroke-dashoffset .6s ease-out}#syStem.grow0{stroke-dashoffset:120}
.sy-spot{fill:#ffd27a;opacity:.55;animation:sySpot 1s ease-in-out infinite}@keyframes sySpot{50%{opacity:.15}}
.sy-msg{text-align:center;font-size:20px;font-weight:800;margin:10px 8px;line-height:1.5}
.sy-btns{flex-wrap:wrap}.sy-end{font-size:90px;text-align:center;margin:20px 0}
#syBarWrap{display:flex;justify-content:center;margin-top:6px}#syBarWrap.tapme .sy-bar{animation:hglow 1.1s ease-in-out infinite;border-radius:12px}
.sy-bar{display:flex;gap:6px;height:64px}.sy-pc{background:#d9ad72;border-radius:10px;border:3px solid #b98a52;display:flex;align-items:center;justify-content:center}
.sy-bar.split .sy-pc{animation:sySplit .5s ease-out}@keyframes sySplit{from{transform:scaleX(.6)}}
.sy-pn svg{height:52px!important;width:auto!important}
.sy-blk{display:flex;margin:8px auto 0;border:4px solid #c98b4a;border-radius:14px;padding:3px;background:#fff8ee;gap:0}
.sy-cell{height:60px;display:flex;align-items:center;justify-content:center;border-right:2px dashed #e1c9a5}.sy-cell:last-child{border-right:0}
.sy-cell.on{background:#d9ad72}.sy-cell.on b{color:#3a2a1e;font-size:18px}.sy-cell.lit{background:#ffcf6e;transform:scale(1.04)}
.acc-link{width:100%;border:0;text-align:left}
.nhead{font-weight:800;font-size:17px;color:var(--sub);margin:12px 4px 6px}
.ngrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ntile{background:#fff;border:0;border-radius:18px;box-shadow:0 3px 0 #e8dccb;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px}
.ntile svg{height:70px!important;width:auto!important;max-width:100%}.ntile span{font-size:12px;font-weight:800;color:var(--sub);line-height:1.3}
.tapflash{outline:4px solid #ffcf6e;outline-offset:2px;border-radius:12px}
#stSeq [data-pi]{cursor:pointer}
.qhead{font-weight:800;font-size:15px;color:var(--sub);margin:10px 4px 2px;text-align:left}
.singbox{display:flex;flex-direction:column;align-items:center;gap:10px}
#cap{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:92vw;background:#3a2a1e;color:#fff;font-weight:800;font-size:16px;padding:10px 16px;border-radius:16px;opacity:0;pointer-events:none;transition:.25s;z-index:60;text-align:center}
#cap.on{opacity:.94;transform:translate(-50%,0)}
.sndt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.sndt button{padding:12px 6px;font-size:15px}
.sndst{font-family:ui-monospace,monospace;font-size:12px;text-align:left;background:#f4ede3;border-radius:10px;padding:8px;white-space:pre-wrap;max-height:30vh;overflow:auto}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chk button{font-size:13px;padding:8px 10px}.chkh{font-weight:800;text-align:left;margin-top:6px}
.bento.wood .blk{--c:#d9ad72!important;color:#3a2a1e;text-shadow:none}
.bento.wood .blk.rest{background:#fff}
.bento .pc{position:relative}.bento .pcn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.bento .pc{overflow:hidden}.bento .pcn svg{width:auto!important;height:calc(var(--bh) * .8)!important;max-width:92%}
.bn-pal.anap{grid-template-columns:repeat(4,1fr)!important}
.bento .hole{flex:none;margin-right:2px;border:3px dashed #c98b4a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#c98b4a;background:#fff8ee;animation:holeb 1.4s ease-in-out infinite}
@keyframes holeb{50%{background:#fde9cf}}
.bento .pc.drop{animation:dropin .35s cubic-bezier(.3,1.6,.6,1)}@keyframes dropin{from{transform:translateY(-30px);opacity:0}}
.bn-pc.ana{min-height:90px;justify-content:center}.bn-pc.ana svg{height:66px;width:auto!important;max-width:100%}

const GROUPS=[{g:1,name:'のばす おと'},{g:2,name:'おやすみ'},{g:3,name:'はんぶん'},{g:4,name:'たべもの'},{g:5,name:'れんぷ'}];
const byId=id=>WORDS.find(w=>w.id===id);
const NUMMAP={'にー':'2','さん':'3','しー':'4'};
const lab0=x=>S.num&&NUMMAP[x]?NUMMAP[x]:x;
const lab=x=>NUMMAP[x]?`<i class="lb" data-s="${x}">${lab0(x)}</i>`:x;
function numRelabel(){document.querySelectorAll('.lb').forEach(i=>i.textContent=lab0(i.dataset.s));document.querySelectorAll('[data-wid]').forEach(e=>{const w=byId(e.dataset.wid);if(w)e.textContent=W(w);});}
const W=w=>S.num?w.w.replace(/にー/g,'2').replace(/さん/g,'3').replace(/しー/g,'4'):w.w;
/* 2 3 4 の ときは おんぷの なまえも すうじ（しぶおんぷ → 4ぶおんぷ）。こえは そのまま */
const NUMRE=/(じゅうろく|はち|し|に)ぶ(おんぷ|きゅうふ)/g,NUMV={'じゅうろく':'16','はち':'8','し':'4','に':'2'};
function numText(n){if(n.__o==null){if(!NUMRE.test(n.nodeValue)){NUMRE.lastIndex=0;return;}NUMRE.lastIndex=0;n.__o=n.nodeValue;}
  const v=S.num?n.__o.replace(NUMRE,(m,a,b)=>NUMV[a]+'ぶ'+b):n.__o;if(n.nodeValue!==v){n.__w=v;n.nodeValue=v;}}
function numWalk(root){const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=tw.nextNode()))numText(n);}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData'){const t=m.target;if(t.nodeValue===t.__w||t.nodeValue===t.__o)continue;t.__o=null;numText(t);}
  else m.addedNodes.forEach(x=>{if(x.nodeType===3)numText(x);else if(x.nodeType===1&&x.tagName!=='SCRIPT')numWalk(x);});}}).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
const len=w=>w.ev.reduce((a,e)=>a+e.d,0);
const VERSION='11/11-h';
const near=(a,b)=>Math.abs(a-b)<1e-3;
const $=s=>document.querySelector(s);

/* ===================== storage ===================== */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({bpm:72,voice:1,click:1,num:0,clap:0,lbl:0,len:0,unlock:0,tts:1},store.get('rz_set',{}));
let STARS=store.get('rz_stars',0);
function addStar(n=1){STARS+=n;store.set('rz_stars',STARS);$('#stars').textContent='⭐ '+STARS;}
$('#stars').textContent='⭐ '+STARS;
const beat=()=>{let b=S.bpm;try{const cs=curStep();if(VIEW==='step'&&cs&&cs.bpm)b=Math.min(b,cs.bpm);}catch(e){}return 60/b;};
function curStep(){return ST.custom||COURSE[ST.i];}

/* ===================== audio ===================== */
let AC=null;
let MASTER=null;
function out(){const a=ac();if(!MASTER){const g=a.createGain();g.gain.value=1;const c=a.createDynamicsCompressor();c.threshold.value=-4;c.knee.value=3;c.ratio.value=20;c.attack.value=.002;c.release.value=.1;g.connect(c);c.connect(a.destination);MASTER=g;}return MASTER;}
let VBUS=null;function vout(){const a=ac();if(!VBUS){VBUS=a.createGain();VBUS.gain.value=.75;VBUS.connect(out());}return VBUS;}
const ALOG=[];function alog(m){const d=new Date();ALOG.push(`${d.toTimeString().slice(0,8)} ${m}`);if(ALOG.length>14)ALOG.shift();}
function ac(){if(!AC){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}AC=new (window.AudioContext||window.webkitAudioContext)();alog('おとの しくみ スタート：'+AC.state);AC.onstatechange=()=>alog('じょうたい → '+AC.state);}if(AC.state!=='running'){try{AC.resume();}catch(e){}}return AC;}
/* iPhone: 音が とまったら つぎに さわったときに もどす */
let AUDIO_UNLOCKED=false;
function audioKick(){try{try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}const a=ac();if(!AUDIO_UNLOCKED){const b=a.createBuffer(1,1,22050);const s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);AUDIO_UNLOCKED=true;}}catch(e){}}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(!AC||AC.state!=='running'||!AUDIO_UNLOCKED)audioKick();},{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&AC&&AC.state!=='running'){try{AC.resume();}catch(e){}}});
/* 止まっていたら さわったときに もどす（つくりなおしは しない） */
['pointerdown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(AC&&AC.state!=='running'){try{AC.resume().catch(()=>{});}catch(e){}}},{capture:true,passive:true}));
setInterval(()=>{if(AC&&AC.state!=='running'&&document.visibilityState==='visible'){try{AC.resume().catch(()=>{});}catch(e){}}},1500);
function newSess(){const a=ac();const g=a.createGain();g.connect(out());return g;}
function killSess(g){if(!g)return;try{const a=ac();g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(0,a.currentTime);setTimeout(()=>{try{g.disconnect()}catch(e){}},200)}catch(e){}}
function tone(t,dur,dest,f=523.25,vol=.42){
  const a=ac();const g=a.createGain();g.connect(dest||out());
  const o=a.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(g);
  const o2=a.createOscillator();o2.type='sine';o2.frequency.value=f*2;const g2=a.createGain();g2.gain.value=.1;o2.connect(g2);g2.connect(g);
  dur=Math.max(dur,.08);const end=t+dur;const sus=Math.min(.25,dur*.5);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.linearRampToValueAtTime(vol*.65,t+sus);g.gain.setValueAtTime(vol*.65,end-.02);
  g.gain.linearRampToValueAtTime(.0001,end+.03);
  o.start(t);o2.start(t);o.stop(end+.06);o2.stop(end+.06);
}
function holdTone(){
  const a=ac();const t=a.currentTime;const g=a.createGain();g.connect(out());
  const o=a.createOscillator();o.type='triangle';o.frequency.value=523.25;o.connect(g);
  const o2=a.createOscillator();o2.type='sine';o2.frequency.value=1046.5;const g2=a.createGain();g2.gain.value=.22;o2.connect(g2);g2.connect(g);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.012);g.gain.linearRampToValueAtTime(.2,t+.25);
  o.start(t);o2.start(t);
  return ()=>{const n=a.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(.0001,n+.04);o.stop(n+.06);o2.stop(n+.06);};
}
function click(t,acc,dest){
  const a=ac();const o=a.createOscillator();const g=a.createGain();o.type='sine';o.frequency.value=acc?1700:1150;
  o.connect(g);g.connect(dest||out());g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(acc?.5:.32,t+.003);
  g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.start(t);o.stop(t+.08);
}
function bell(t,dest){
  const a=ac();t=t||a.currentTime;[2093,3136].forEach((f,i)=>{const o=a.createOscillator();const g=a.createGain();o.type='sine';o.frequency.value=f;
  o.connect(g);g.connect(dest||out());g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(i?.06:.18,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.start(t);o.stop(t+1);});
}
function yay(){const a=ac();const t=a.currentTime;[523,659,784,1047].forEach((f,i)=>tone(t+i*.08,.14,null,f,.35));}
function buzz(){const a=ac();const t=a.currentTime;tone(t,.18,null,220,.35);tone(t+.2,.25,null,196,.35);}

/* own files (images / voices) on GitHub */

  pittari:'ぴったり',mousukoshi:'もうすこし',nagasugi:'ながすぎたよ',seikai:'せいかい',hairanai:'はいらないよ',kiite:'きいてね',issho:'ずんだもんと いっしょに いってみよう',osite:'▶を おしてね',tataku:'こんどは ひとりで。いいながら ボタンを たたいてね',tebyoushi:'こんどは ひとりで。いいながら てを たたいてね',rhythm:'ずんだもんと いっしょに、くちで いいながら たたこう',osaete:'こんどは おんぷの ながさだけ ボタンを おさえてみよう',mouichidoosu:'もういちど おしてみよう',tsugi:'つぎに すすむなら ボタンを おしてね',osuto:'ボタンを おすと もういちど できるよ',dekita:'できた',mouichido:'おしい。もういちど きいてみよう',again:'もういちど やるときは ボタンを おしてね',oshii:'おしい',mouichidotataku:'もういちど たたいてみよう',mouichidokiku:'もういちど きいてみよう',yatta:'やったー おめでとう',nanko:'いくつ のばすかな',levelup:'レベルアップ',master:'リズムマスター おめでとう',zenbu:'ぜんぶ できたね',ganbatta:'よく がんばったね'};

async function probeFiles(){
  if(!/^https?:/.test(location.protocol))return;
  const keys=[];WORDS.forEach(w=>{keys.push('koe-'+w.k,'na-'+w.nk);});Object.keys(PROMPTS).forEach(k=>keys.push('koe-'+k));keys.push('na-hachibu','na-hachibu-kyuufu');
  Object.values({tan:1,un:1,ni:1,san:1,shi:1,ta:1,ka:1,u:1}).length;['tan','un','ni','san','shi','ta','ka','u'].forEach(k=>keys.push('syl-'+k));
  Object.values(CLIP_ALIAS).forEach(k=>keys.push(k));
  ['zou','inu','risu'].forEach(k=>keys.push('mel-'+k));for(let k=1;k<=16;k++)keys.push('kazu-'+k);
  [...new Set(Object.values(KANAR))].forEach(k=>keys.push('kana-'+k));
  /* PROMPTS の ほかに よぶ こえ（どうぶつクイズ・おべんとう・なまえ・ステップ） */
  ['bye-zou','bye-inu','bye-risu','dare','chigau','tsuginodare','ana','sukima','zunda','st1','st2','st3','st4','st4b','st5','st5b','st6','st6b','st7','st7b','st8','st9','st10','st10b','st11','st12'].forEach(k=>keys.push('koe-'+k));
  Object.keys(HM_TEXT).forEach(k=>keys.push('hm-'+k));
  [...NAMEQ,...NAMEQR].forEach(x=>keys.push('koe-dore-'+x.id));COURSE.forEach(c=>keys.push('koe-step-'+c.id));
  const names=[...new Set(keys)].flatMap(k=>/^kana-/.test(k)?[k+'.mp3']:/^mel-/.test(k)?[k+'.m4a',k+'.mp3']:[k+'.mp3',k+'.wav',k+'.m4a']).concat(WORDS.flatMap(w=>['e-'+w.k+'.png','e-'+w.k+'.PNG']));
  await Promise.all(names.map(n=>fetch(n,{method:'HEAD',cache:'no-cache'}).then(r=>{if(r.ok)AV.add(n);}).catch(()=>{})));
  AV.forEach(n=>{if(!/\.png$/i.test(n)&&!/^(syl|kana)-/.test(n))CLIPS[n]=null;});

/* ===================== nobashi (hold game) ===================== */
const NB={id:'w',hint:true,countIn:false,state:'idle',raf:0,sess:null,stopTone:null,timers:[]};
const NB_IDS=['q','h','dh','w'];
function renderNobashi(){
  $('#nbChips').innerHTML=NB_IDS.map(id=>{const w=byId(id);return `<button class="chip${id===NB.id?' on':''}" data-id="${id}">${W(w)}</button>`;}).join('');
  $('#nbChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{NB.id=c.dataset.id;nbReset(true);renderNobashi();});
  const w=byId(NB.id),n=len(w);
  const u=Math.floor(Math.min(92,(availW())/(n+1)));
  let slots='';
  for(let k=0;k<n+1;k++){const lb=k<n?lab(w.ev[0].syl[k]):'';slots+=`<div class="slot ${k<n?'tg':'extra'}" style="left:${k*u}px" data-k="${k}">${lb||'・'}</div>`;}
  $('#nbTop').innerHTML=`${notation(w.ev,n>=3?1.5:1.9,true,null,true)}
    <div class="track${NB.hint?' hint':''}" id="nbTrack" style="--u:${u}px;--c:${w.col};width:${(n+1)*u}px"><div class="fill" id="nbFill"></div>${slots}</div>`;
  $('#togHint').classList.toggle('on',NB.hint);$('#togCount').classList.toggle('on',NB.countIn);
  nbIdleMsg();
}
function nbIdleMsg(){
  const w=byId(NB.id);
  $('#nbMsg').innerHTML=NB.countIn?`スタートで かぞえるよ<small>「はい」の つぎで ぎゅっと おそう</small>`
    :`ぎゅっと おして のばそう<small>カチ カチ に あわせて「${W(w)}」</small>`;
  const b=$('#holdBtn');b.className='hold';b.textContent=NB.countIn?'スタート':'ぎゅっ';
}
function nbReset(silent){
  cancelAnimationFrame(NB.raf);NB.timers.forEach(clearTimeout);NB.timers=[];
  if(NB.stopTone){NB.stopTone();NB.stopTone=null;}killSess(NB.sess);NB.sess=null;NB.state='idle';
  const tr=$('#nbTrack');if(tr){tr.classList.remove('reach');tr.querySelectorAll('.slot').forEach(s=>s.classList.remove('passed'));$('#nbFill').style.width='0';}
  if(!silent)nbIdleMsg();
}
$('#togHint').onclick=()=>{NB.hint=!NB.hint;nbReset(true);renderNobashi();};
$('#togCount').onclick=()=>{NB.countIn=!NB.countIn;nbReset(true);renderNobashi();};
const holdBtn=$('#holdBtn');
holdBtn.addEventListener('contextmenu',e=>e.preventDefault());
holdBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();try{holdBtn.setPointerCapture(e.pointerId)}catch(_){}
  const a=ac(),now=a.currentTime,B=beat();
  if(NB.state==='idle'||NB.state==='done'){
    nbReset(true);
    if(NB.countIn){startCount();return;}
    beginHold(now,now);return;
  }
  if(NB.state==='count'){
    if(now<NB.D-.5*B){$('#nbMsg').innerHTML='まだだよ<small>「はい」の つぎで おしてね</small>';return;}
    beginHold(now,NB.D);
  }
});
['pointerup','pointercancel'].forEach(t=>holdBtn.addEventListener(t,()=>{if(NB.state==='hold')nbFinish(ac().currentTime,false);}));

function startCount(){
  const a=ac(),B=beat(),t0=a.currentTime+.15,w=byId(NB.id),n=len(w);
  NB.state='count';NB.sess=newSess();
  for(let b=0;b<4;b++)click(t0+b*B,b===0,NB.sess);
  bell(t0+3*B,NB.sess);
  NB.D=t0+4*B;
  for(let b=0;b<n+2;b++)click(NB.D+b*B,b===0,NB.sess);
  const btn=$('#holdBtn');btn.className='hold count';btn.textContent='';
  $('#nbMsg').innerHTML='かぞえるよ<small>「はい」の つぎで おしてね</small>';
  const off=(t0-a.currentTime)*1000;
  ['1','2','3','はい'].forEach((x,i)=>NB.timers.push(setTimeout(()=>{if(NB.state!=='count')return;btn.textContent=x;
    btn.style.background=x==='はい'?'radial-gradient(circle at 35% 30%,#ff9a85,var(--c1))':'';},off+i*B*1000)));
  NB.timers.push(setTimeout(()=>{if(NB.state!=='count')return;btn.className='hold';btn.style.background='';btn.textContent='いま！';},off+4*B*1000));
  NB.timers.push(setTimeout(()=>{if(NB.state!=='count')return;nbReset(true);
    $('#nbMsg').innerHTML='あれれ？<small>「はい」の つぎで ぎゅっと おしてね。もういちど！</small>';
    const b=$('#holdBtn');b.className='hold';b.style.background='';b.textContent='スタート';},off+5.6*B*1000));
}
function beginHold(now,grid){
  const B=beat(),w=byId(NB.id),n=len(w);
  NB.timers.forEach(clearTimeout);NB.timers=[];
  NB.state='hold';NB.start=now;NB.grid=grid;NB.flag=false;NB.stopTone=holdTone();
  const btn=$('#holdBtn');btn.className='hold down';btn.style.background='';btn.textContent='';
  if(!NB.countIn){NB.sess=newSess();for(let b=0;b<n+2;b++)click(now+b*B,b===0,NB.sess);}
  $('#nbMsg').innerHTML='';
  const tr=$('#nbTrack'),fill=$('#nbFill'),u=parseFloat(tr.style.getPropertyValue('--u')),slots=[...tr.querySelectorAll('.slot')];
  let lastK=-1;
  const loop=()=>{
    if(NB.state!=='hold')return;
    const held=(ac().currentTime-NB.start)/B;
    fill.style.width=Math.min(held,n+1)*u+'px';
    const k=Math.floor(held);
    if(k!==lastK){lastK=k;slots.forEach((s,i)=>s.classList.toggle('passed',i<=k));
}
    if(NB.hint&&!NB.flag&&held>=n-.12){NB.flag=true;tr.classList.add('reach');$('#nbMsg').innerHTML='はなして！';}
    if(held>=n+1){nbFinish(ac().currentTime,true);return;}
    NB.raf=requestAnimationFrame(loop);
  };
  loop();
}
function nbFinish(now,auto){
  const B=beat(),w=byId(NB.id),n=len(w);
  NB.state='done';cancelAnimationFrame(NB.raf);
  if(NB.stopTone){NB.stopTone();NB.stopTone=null;}killSess(NB.sess);NB.sess=null;
  $('#nbTrack').classList.remove('reach');
  const held=(now-NB.start)/B,err=held-n,tol=n===1?.28:.33;
  let pressNote='';
  if(NB.countIn){const off=(NB.start-NB.grid)/B;
    pressNote=Math.abs(off)<=.3?'おすのも ぴったり！':off<0?'おすのが ちょっと はやかったよ':'おすのが ちょっと おそかったよ';}
  const btn=$('#holdBtn');btn.className='hold';btn.textContent=NB.countIn?'もういちど':'ぎゅっ';
  let t,sub,ok=false;
  if(auto||err>tol){t='ちょっと ながすぎたよ';sub=`「${w.ev[0].syl[n-1]}」の つぎで はなそう`;}
  else if(err<-tol){t='もうすこし ながーく！';sub=`「${W(w)}」まで のばそう`;}
  else{t='ぴったり！ 🌟';sub=NB.hint?'つぎは ヒントなしで やってみよう':'すごい！ ヒントなしで できたね';ok=true;}
  if(pressNote)sub=pressNote+'　'+sub;
  $('#nbMsg').innerHTML=`${t}<small>${sub}</small>`;
  if(ok){yay();addStar(NB.hint?1:2);P('pittari');}else{P(err<0?'mousukoshi':'nagasugi');}
}

/* ===================== なまえの ひみつ ===================== */
const NAMEINFO={
  q:{base:'w',div:4,num:'4'},h:{base:'w',div:2,num:'2'},w:{base:'w',div:1},dh:{base:'dh',parts:['h','q']},
  qr:{base:'wr',div:4,num:'4'},hr:{base:'wr',div:2,num:'2'},wr:{base:'wr',div:1},dhr:{base:'dhr',parts:['hr','qr']},
  ee:{base:'w',div:8,num:'8',unit:'はちぶおんぷ'},er:{base:'w',div:8,num:'8',unit:'はちぶおんぷ'},re:{base:'wr',div:8,num:'8',unit:'はちぶきゅうふ',rest:1},
  t5:{base:'q',div:5,tp:1},t6:{base:'q',div:6,tp:1},t7:{base:'q',div:7,tp:1}
};
['f1','f2','f3','f4','f5','f6','f7','f8','f9'].forEach(id=>NAMEINFO[id]={base:'w',div:16,num:'16',unit:'じゅうろくぶおんぷ'});
const PCOL={1:'var(--c1)',2:'var(--c2)',3:'var(--c3)',4:'var(--c4)'};
let NL_TIMERS=[];
function closeModal(){NL_TIMERS.forEach(clearTimeout);NL_TIMERS=[];$('#modal').classList.remove('on','sheet');document.body.classList.remove('sheeton');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function NKMAP(){const m={'はちぶおんぷ':'hachibu','はちぶきゅうふ':'hachibu-kyuufu','じゅうろくぶおんぷ':'juurokubu','たん（しぶおんぷ）':'shibuonpu'};WORDS.forEach(w=>{if(w.nk&&!m[w.nm])m[w.nm]=w.nk;});return m;}
function beam8x4(){/* はちぶおんぷ 4つを 1本の はりで つなぐ（タカタカ） */
  let h='<svg viewBox="0 0 124 66" width="124" height="66">';[16,46,76,106].forEach(x=>{h+=`<ellipse cx="${x}" cy="50" rx="8.5" ry="5.8" transform="rotate(-18 ${x} 50)" fill="#2b2320"/><line x1="${x+7.6}" y1="48" x2="${x+7.6}" y2="12" stroke="#2b2320" stroke-width="2.4"/>`;});
  return h+'<rect x="22.4" y="9" width="91.6" height="7" fill="#2b2320"/></svg>';}
const HM_TEXT={
  tan4:'これは ぜんおんぷ。わけない、まるごとの ながさ だよ',
  tan2:'ぜんおんぷを 2つに わけたから、にぶおんぷ って いうんだよ',
  tan3:'にぶおんぷに ほくろが ついたら、ふてん にぶおんぷ って いうんだよ',
  tan:'ぜんおんぷを 4つに わけたから、しぶおんぷ って いうんだよ',
  hachibu:'ぜんおんぷを 8つに わけたから、はちぶおんぷ って いうんだよ',
  juurokubu:'ぜんおんぷを 16に わけたから、じゅうろくぶおんぷ って いうんだよ',
  un4:'これは ぜんきゅうふ。まるごと おやすみ だよ',
  un2:'ぜんきゅうふを 2つに わけたから、にぶきゅうふ って いうんだよ',
  un3:'にぶきゅうふに ほくろが ついたら、ふてん にぶきゅうふ って いうんだよ',
  un:'ぜんきゅうふを 4つに わけたから、しぶきゅうふ って いうんだよ',
  'hachibu-kyuufu':'ぜんきゅうふを 8つに わけたから、はちぶきゅうふ って いうんだよ'};
function openNameLesson(w){
  const info=NAMEINFO[w.id];if(!info){speak('na-'+w.nk,w.nm);return;}
  const base=byId(info.base),bl=len(base);
  const W=Math.min(380,window.innerWidth-70);
  const isRest=base.ev[0].r;
  const unitName=info.unit||w.nm;
  // pieces
  let pieces=[];
  if(info.parts)pieces=info.parts.map(id=>({len:len(byId(id)),col:byId(id).col,r:byId(id).ev[0].r,lab:byId(id).w,nm:byId(id).nm}));
  else{const L=bl/info.div;const col=info.tp?'var(--c16)':info.div===16?'var(--c16)':info.div===8?'var(--c8)':PCOL[L]||'var(--c1)';
    for(let i=0;i<info.div;i++)pieces.push({len:L,col,r:isRest||info.rest,lab:info.div<=4?(isRest?'うん':'たん').repeat(1):'',nm:unitName});}
  const px=l=>W*l/bl;
  let pieceHTML=pieces.map((p,i)=>`<div class="nl-p${p.r?' r':''}" style="width:${px(p.len)-3}px;--c:${p.col}" data-i="${i}" data-nm="${p.nm}">${px(p.len)>16?noteIcon({d:info.tp?.25:p.len,r:p.r}):''}</div>`).join('');
  if((info.div===16||info.div===8)&&!info.parts&&!info.tp&&!isRest){const d=info.div===16?.25:.5,ng=info.div/4,gw=W/ng-3,pw=(gw-6)/4;let h='';
    for(let g=0;g<ng;g++){h+=`<div class="nl-g" style="width:${gw}px">`;for(let k=0;k<4;k++)h+=`<div class="nl-p" style="width:${pw}px;--c:${pieces[0].col}" data-nm="${pieces[0].nm}"><span class="si">${noteIcon({d})}</span></div>`;
      if(d===.5)h+=`<div class="nl-gi2">${notation([N(.5,''),N(.5,'')],1,true,null,true)}</div>`;
      h+=`<div class="nl-gi">${d===.5?beam8x4():notation([N(d,''),N(d,''),N(d,''),N(d,'')],1,true,null,true)}</div></div>`;}
    pieceHTML=h;}
  const baseLab=info.tp?'たん（1はく）':base.w;
  let sent,sub='',bigName;
  if(info.parts){sent=`${pieces.map(p=>p.nm).join(' と ')} を あわせた ながさ`;bigName=w.nm;sub='てん（・）は「はんぶんを たす」しるし';}
  else if(info.div===1){sent='わけない、まるごと ぜんぶの ながさ';bigName=w.nm;}
  else if(info.tp){sent=`1はくを ${info.div}こに わけたから`;bigName=w.nm;}
  else{sent=`${base.nm} を ${info.div}こに わけたから`;bigName=`<b class="nl-num">${info.num}</b>ぶ${unitName.endsWith('きゅうふ')?'きゅうふ':'おんぷ'}<small>（${unitName}）</small>`;}
  $('#mbox').innerHTML=`<h3>なまえの ひみつ</h3>
    <div class="nl-wrap" style="width:${W}px;--nh:${Math.round(Math.min(W/4,90))}px">
      <div class="nl-ans" id="nlAns">👆 おんぷを おすと なまえが でるよ</div>
      <div class="nl-row top">${pieceHTML}</div>
      <div class="nl-row"><div class="nl-p base${isRest?' r':''}" style="width:${W-3}px;--c:${base.col}" data-nm="${info.tp?'たん（しぶおんぷ）':base.nm}">${noteIcon({d:info.tp?1:bl,r:isRest})}</div></div>
    </div>
    <div class="nl-count" id="nlCount"></div>
    <div class="nl-sent" id="nlSent"></div>
    <div class="btns" style="margin-top:12px"><button class="bigbtn" id="nlAgain" style="background:var(--c3)">🔁 もういちど</button><button class="bigbtn gray" id="nlClose">とじる</button></div>`;
  $('#modal').classList.add('on');
  $('#nlClose').onclick=closeModal;$('#nlAgain').onclick=()=>openNameLesson(w);
  $('#mbox').querySelectorAll('.nl-p').forEach(el=>el.onclick=()=>{const n=el.dataset.nm;if(!n)return;const an=$('#nlAns');if(an){an.textContent=n;an.classList.remove('pop');void an.offsetWidth;an.classList.add('pop');}const nk=NKMAP()[n];nk?speak('na-'+nk,n):say(n);});
  const els=[...$('#mbox').querySelectorAll('.nl-row.top .nl-p')];
  const kz=!info.parts&&els.length>1&&clipName('kazu-1')&&S.voice;
  /* かぞえる こえが さいごまで きこえる はやさに する（じゅういち など） */
  let kmax=0;if(kz)for(let k=1;k<=els.length;k++){const b=CLIPS[clipName('kazu-'+k)];if(b&&b.duration)kmax=Math.max(kmax,b.duration-(b._lead||0));}
  const step=kz?Math.max(560,Math.round(kmax*1000)+140):Math.min(650,Math.max(150,2600/els.length));
  NL_TIMERS.forEach(clearTimeout);NL_TIMERS=[];
  els.forEach((e,i)=>NL_TIMERS.push(setTimeout(()=>{e.classList.add('in');const pg=e.parentElement;
    if(pg.classList.contains('nl-g')){if(i%4===1&&pg.querySelector('.nl-gi2'))pg.classList.add('pair');if(i%4===3){pg.classList.remove('pair');pg.classList.add('in');}}
    if(!info.parts&&els.length>1){const c=$('#nlCount');c.textContent=(i+1);c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');}
    if(kz&&clipName('kazu-'+(i+1))){speak('kazu-'+(i+1),'');return;}
    try{tone(ac().currentTime,.09,null,e.classList.contains('r')?392:659,.3);}catch(_){}},900+i*step)));
  NL_TIMERS.push(setTimeout(()=>{
    $('#nlCount').textContent='';
    $('#nlSent').innerHTML=`<div class="nl-big">${bigName}</div>`;
    const say1=HM_TEXT[w.k]||`${sent.replace(/\s+/g,' ')}、${w.nm.replace(' 2つ','')}`;
    speak('hm-'+w.k,say1);
  },900+els.length*step+300));
}
function unitEv(w,info){
  if(info.tp)return w.ev;
  if(info.div===16)return [N(.25,'')];
  if(info.div===8)return [N(.5,'',info.rest)];
  return w.ev.slice(0,1);
}

/* ===================== bento (1小節パズル・レベルつき) ===================== */
const BN_LEVELS=[['q','w'],['h'],['dh'],['qr','hr'],['ee'],['er','re'],['f1','f2','f6'],['f3','f4','f5'],['f7','f8','f9'],['t5','t6','t7']];
const BN_STAMP=['🐕','🐘','🌈','🎈','💤','🐿️','🎵','🐙','🥩','🍡'];
const BP=Object.assign({lv:1,step:'shape',hist:[],stamps:{},master:null,renpu:null},store.get('rz_bn',{}));
const bpSave=()=>store.set('rz_bn',BP);
const BN={mode:'odai',items:[],target:null,done:false,cap:4,miss:false,hint:false,auto:0,blank:-1,choices:[],fresh:false};
const bnAna=()=>BN.mode==='odai'&&BP.lv>=2;
const bnLen=()=>BN.items.reduce((a,w)=>a+len(w),0);
const today=()=>{const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;};
function bnUnlocked(){return BN_LEVELS.slice(0,BP.lv).flat().map(byId);}
function bnNewIds(){return BN_LEVELS[BP.lv-1];}
function bnLast(n){return BP.hist.slice(-n);}
function bnStruggling(){const l=bnLast(5);return BP.step==='score'&&l.length>=3&&l.reduce((a,b)=>a+b,0)<=Math.floor(l.length/2);}
function bnMakeTarget(){
  const pool=bnUnlocked(),nw=bnNewIds(),easy=bnStruggling();
  let out,guard=0;
  do{
    out=[];let rem=BN.cap,g=0;
    while(rem>1e-6&&g++<30){
      let c=pool.filter(w=>len(w)<=rem+1e-6);
      if(out.length&&out[out.length-1].ev.every(e=>e.r)){const c2=c.filter(w=>!w.ev.every(e=>e.r));if(c2.length)c=c2;}
      if(easy&&BP.lv>1){const old=c.filter(w=>!nw.includes(w.id));if(old.length)c=old;}
      const wt=c.map(w=>nw.includes(w.id)&&!easy?3:1);
      let r=Math.random()*wt.reduce((a,b)=>a+b,0),pick=c[0];
      for(let i=0;i<c.length;i++){r-=wt[i];if(r<=0){pick=c[i];break;}}
      out.push(pick);rem-=len(pick);
    }
    guard++;
  }while(guard<40&&(
    out.every(w=>w.ev.every(e=>e.r))||
    (!easy&&BP.lv>1&&!out.some(w=>nw.includes(w.id))&&Math.random()<.75)||
    (BN.target&&out.map(w=>w.id).join()===BN.target.map(w=>w.id).join()&&BP.lv>1)));
  return out;
}
function bnNewQ(){
  clearTimeout(BN.auto);
  BN.items=[];BN.done=false;BN.miss=false;
  const l2=bnLast(2);
  BN.hint=BP.step==='shape'||(l2.length===2&&!l2[0]&&!l2[1]);
  BN.target=bnMakeTarget();BN.fresh=true;
  if(BP.lv>=2){/* あなうめ：1つ ぬけている ところに はいる おんぷを えらぶ */
    BP.step='score';BN.hint=false;const nw=bnNewIds();
    const idx=BN.target.map((w,i)=>i),nidx=idx.filter(i=>nw.includes(BN.target[i].id));
    const bi=nidx.length&&Math.random()<.7?nidx[Math.random()*nidx.length|0]:idx[Math.random()*idx.length|0];
    BN.blank=bi;const ans=BN.target[bi];
    const seen=new Set();const others=shuffle(bnUnlocked()).filter(w=>{const k=JSON.stringify(w.ev.map(e=>[e.d,e.r]));
      if(Math.abs(len(w)-len(ans))<1e-6||seen.has(k))return false;seen.add(k);return true;}).slice(0,3);
    BN.choices=shuffle([ans,...others]);}
}
function renderBento(){
  $('#bnMode').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.v===BN.mode);
    b.onclick=()=>{ac();BN.mode=b.dataset.v;if(BN.mode==='odai')bnNewQ();else{BN.items=[];BN.done=false;}renderBento();};});
  if(BN.mode==='odai'&&!BN.target)bnNewQ();
  bnDrawLv();bnDrawTarget();bnDrawBox();bnDrawPal();
  $('#bnNext').style.display=BN.mode==='odai'?'':'none';
  if(bnAna()){$('#bnMsg').textContent=BN.done?$('#bnMsg').textContent:'あいている ところに はいる おんぷは どれ？';
    if(BN.fresh&&VIEW==='bento'){BN.fresh=false;if(!$('#modal').classList.contains('on'))speak('koe-ana','あいている ところに はいる おんぷは どれ？');}return;}
  if(!BN.done)$('#bnMsg').textContent=BN.mode==='free'?'おかずを タップして つめよう':BN.hint?'おなじ かたちの おかずを いれよう':'がくふと おなじに つめよう';
}
function bnDrawLv(){
  const el=$('#bnLvBar');
  if(BN.mode==='free'){el.innerHTML=`<span class="step">レベル${BP.lv} までの おかずで あそべるよ</span>`;return;}
  let dots='';
  if(BP.step==='shape'){let k=0;for(let i=BP.hist.length-1;i>=0&&BP.hist[i];i--)k++;k=Math.min(k,3);for(let i=0;i<3;i++)dots+=`<i class="${i<k?'ok':''}"></i>`;}
  else{const l=bnLast(5);for(let i=0;i<5;i++)dots+=`<i class="${i<l.length?(l[i]?'ok':'ng'):''}"></i>`;}
  el.innerHTML=`<span class="lvb">レベル ${BP.lv}${BP.lv===10?' れんぷ':''}</span><span class="step">${BP.lv>=2?'あなうめ':BP.step==='shape'?'かたち':'がくふ'}</span><span class="pd">${dots}</span>`;
}
function bnDrawTarget(){
  const el=$('#bnTarget');
  if(BN.mode!=='odai'||bnAna()){el.innerHTML='';return;}
  if(BP.step==='score'){el.innerHTML=`<div class="bn-target"><div class="hint" style="margin:0">この リズムを つくろう</div>${notation(BN.target.flatMap(w=>w.ev),1.6,true,null,true)}</div>`;}
  else el.innerHTML='';
}
function bnUnit(){return Math.floor(Math.min(92,(availW()-30)/BN.cap));}
function bnDrawBox(){
  const u=bnUnit(),bh=Math.round(Math.min(u,95));
  if(bnAna()){let pcs='',t=0;
    BN.target.forEach((w,i)=>{
      if(i===BN.blank&&!BN.done){pcs+=`<div class="hole" style="width:${len(w)*u-2}px;height:${bh}px">？</div>`;t+=len(w);return;}
      let inner='',tt=t;w.ev.forEach(e=>{inner+=evBlk(e,tt,w,false);tt+=e.d;});
      pcs+=`<div class="pc${i===BN.blank?' drop':''}" style="margin-right:2px">${inner}<div class="pcn">${notation(w.ev,1,true,null,true)}</div></div>`;t+=len(w);});
    let cells='';for(let k=0;k<BN.cap;k++)cells+='<div class="cell"></div>';
    const box=$('#bnBox');box.className='bento wood'+(BN.done?' good':'');box.style.width=(BN.cap*u+26)+'px';
    box.innerHTML=`<div class="cells">${cells}</div><div class="lay blocks" style="--u:${u}px;--bh:${bh}px;height:${bh+8}px;justify-content:flex-start">${pcs}</div>`;
    $('#bnNote').innerHTML='';return;}
  let ghosts='';
  if(BN.mode==='odai'&&BN.hint){let t=0,g='';BN.target.forEach(w=>{let inner='';
    w.ev.forEach(e=>{inner+=evBlk(e,t,w,false);t+=e.d;});
    g+=`<div class="pc" style="margin-right:2px">${inner}</div>`;});
    ghosts=`<div class="ghost">${g}</div>`;}
  let pcs='',t=0;
  BN.items.forEach((w,i)=>{let inner='',tt=t;
    w.ev.forEach(e=>{inner+=evBlk(e,tt,w,true);tt+=e.d;});
    pcs+=`<div class="pc" data-i="${i}" style="margin-right:2px">${inner}</div>`;t+=len(w);});
  let cells='';for(let k=0;k<BN.cap;k++)cells+='<div class="cell"></div>';
  const box=$('#bnBox');box.className='bento'+(BN.done&&BN.mode==='odai'?' good':'');box.style.width=(BN.cap*u+26)+'px';
  box.innerHTML=`<div class="cells">${cells}</div><div class="lay blocks" style="--u:${u}px;--bh:${bh}px;height:${bh+8}px;justify-content:flex-start">${ghosts}${pcs}</div>`;
  box.querySelectorAll('.pc[data-i]').forEach(p=>p.onclick=()=>{if(BN.done&&BN.mode==='odai')return;BN.items.splice(+p.dataset.i,1);BN.done=false;bnDrawBox();bnDrawPal();$('#bnMsg').textContent='';});
  const ev=BN.items.flatMap(w=>w.ev);$('#bnNote').innerHTML=ev.length?notation(ev,1.4,true,null,true):'';
}
function bnDrawPal(){
  const ana=bnAna();['bnUndo','bnClear'].forEach(id=>$('#'+id).style.display=ana?'none':'');
  $('#bnPal').classList.toggle('anap',ana);if(ana){$('#bnPal').innerHTML=BN.choices.map(w=>`<button class="bn-pc ana" data-id="${w.id}">${notation(w.ev,1.3,true,null,true)}</button>`).join('');
    $('#bnPal').querySelectorAll('.bn-pc').forEach(b=>b.onclick=()=>bnPick(byId(b.dataset.id),b));return;}
  const rem=BN.cap-bnLen(),nw=BN.mode==='odai'?bnNewIds():[];
  $('#bnPal').innerHTML=bnUnlocked().map(w=>`<button class="bn-pc${len(w)>rem+1e-6?' no':''}" data-id="${w.id}">
      ${nw.includes(w.id)&&BP.lv>1?'<span class="newb">NEW</span>':''}
      ${notation(w.ev,1,true,null,true)}${blocks(w,Math.min(22,Math.floor(80/len(w))),'nolabel')}<div class="w"${w.w.length>6?' style="font-size:15px;white-space:nowrap"':''}>${W(w)}</div></button>`).join('');
  $('#bnPal').querySelectorAll('.bn-pc').forEach(b=>b.onclick=()=>bnAdd(byId(b.dataset.id),b));
}
function bnShake(el){el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');}
function bnAdd(w,btn){
  ac();if(BN.done&&BN.mode==='odai')return;
  const rem=BN.cap-bnLen();
  if(len(w)>rem+1e-6){bnShake(btn);buzz();$('#bnMsg').textContent='はいらないよ！ ながすぎるね';speak('koe-hairanai','はいらないよ');return;}
  if(BN.mode==='odai'&&BN.hint){const nx=BN.target[BN.items.length];
    if(!nx||!sameSound(nx,w)){bnShake(btn);buzz();BN.miss=true;$('#bnMsg').textContent='かたちが ちがうよ';return;}}
  BN.items.push(w);speak('koe-'+w.k,w.w);
  bnDrawBox();bnDrawPal();$('#bnMsg').textContent='';
  if(bnLen()>=BN.cap-1e-6)setTimeout(bnFull,450);
}
const evKey=ws=>JSON.stringify(ws.flatMap(w=>w.ev).map(e=>[Math.round(e.d*1000),e.r]));
async function bnFull(){
  if(BN.mode==='free'){$('#bnMsg').textContent='できた！ よんでみるよ';await wait(200);bnRead();return;}
  if(evKey(BN.items)!==evKey(BN.target)){
    BN.miss=true;bnShake($('#bnBox'));buzz();$('#bnMsg').textContent='ちがうところが あるよ。おかずを タップして とりだそう';return;}
  bnWin();
}
function bnPick(w,btn){
  ac();if(BN.done)return;const ans=BN.target[BN.blank];
  if(sameSound(w,ans)){BN.items=BN.target.slice();bnWin();return;}
  BN.miss=true;bnShake(btn);buzz();
  if(len(w)>len(ans)){$('#bnMsg').textContent='ながすぎて はいらないよ';speak('koe-hairanai','はいらないよ');}
  else{$('#bnMsg').textContent='すきまが できちゃうよ';speak('koe-sukima','すきまが できちゃうよ');}
}
async function bnWin(){
  BN.done=true;bnDrawBox();yay();flash('⭕');addStar(BN.miss?0:1);
  const r=bnRecord(!BN.miss);bnDrawLv();
  $('#bnMsg').textContent=BN.miss?'できたね！':'せいかい！ おいしそう！';
  await wait(700);const ms=bnRead();
  BN.auto=setTimeout(()=>{
    if(VIEW!=='bento'||BN.mode!=='odai')return;
    if(r.level)bnLevelUp(r.cleared);
    else{if(r.step){$('#bnMsg').textContent='かたち クリア！ こんどは がくふだけで やってみよう';yay();}
      setTimeout(()=>{if(VIEW==='bento'&&BN.mode==='odai'&&BN.done){bnNewQ();renderBento();}},r.step?1600:300);}
  },ms+800);
}
function bnRecord(ok){
  BP.hist.push(ok?1:0);if(BP.hist.length>12)BP.hist.shift();
  const res={step:false,level:false,cleared:BP.lv};
  if(BP.step==='shape'){const l=bnLast(3);if(l.length===3&&l.every(x=>x)){BP.step='score';BP.hist=[];res.step=true;}}
  else if(ok){const l4=bnLast(4),l5=bnLast(5);
    if((l4.length===4&&l4.every(x=>x))||(l5.length===5&&l5.reduce((a,b)=>a+b,0)>=4))res.level=true;}
  if(res.level){
    BP.stamps[BP.lv]=today();
    if(BP.lv===9&&!BP.master)BP.master=today();
    if(BP.lv===10)BP.renpu=BP.renpu||today();
    if(BP.lv<10)BP.lv++;
    BP.step='shape';BP.hist=[];
  }
  bpSave();return res;
}
function openModal(html,sheet){$('#mbox').innerHTML=html;$('#modal').classList.toggle('sheet',!!sheet);document.body.classList.toggle('sheeton',!!sheet);$('#modal').classList.add('on');}
function masterCard(){return `<div class="mcard"><div class="big">🏆</div><div class="t">リズムマスター</div>
  <div>4マスの リズムが よめるように なったよ</div><div class="d">${BP.master}</div></div>`;}
function bnLevelUp(cleared){
  let html;
  if(cleared===9){
    html=`<h3>🎉 おめでとう！ 🎉</h3>${masterCard()}<div class="hint">この がめんを せんせいに みせてね</div>
      <div class="hint">つぎは おまけの「れんぷ」に ちょうせん できるよ</div>`;
    P('master');
  }else if(cleared===10){
    html=`<h3>🎉 れんぷマスター 🎉</h3><div class="stamp got gold" style="width:110px;margin:10px auto;font-size:54px">🍡</div><div class="hint">オムライス・おこのみやき・みたらしだんご ぜんぶ できたね！</div>`;
    P('levelup');
  }else{
    const nw=bnNewIds().map(byId);
    html=`<h3>🎉 レベル ${BP.lv} に アップ！</h3>
      <div class="stamp got" style="width:84px;margin:6px auto;font-size:40px">${BN_STAMP[cleared-1]}</div>
      <div class="hint">スタンプ ゲット！ あたらしい おかずが ふえたよ</div>
      <div class="grid" style="grid-template-columns:repeat(${nw.length},1fr);margin:10px 0">${nw.map(w=>`<div class="card">${notation(w.ev,1,true,null,true)}${blocks(w,Math.min(22,Math.floor(80/len(w))),'nolabel')}<div class="w">${W(w)}</div></div>`).join('')}</div>`;
    P('levelup');
  }
  yay();
  openModal(html+`<div class="btns" style="margin-top:10px"><button class="bigbtn" id="mGo" style="background:var(--c3)">やってみる ▶</button></div>`);
  $('#mGo').onclick=()=>{closeModal();bnNewQ();renderBento();};
}
function bnShowCard(){
  let st='';for(let i=1;i<=10;i++){const got=BP.stamps[i];
    st+=`<div class="stamp${got?' got':''}${i===10?' gold':''}">${got?BN_STAMP[i-1]:''}<small>${i===10?'れんぷ':'Lv'+i}</small></div>`;}
  openModal(`<h3>🎫 スタンプカード</h3><div class="hint">いまは レベル ${BP.lv}</div><div class="stamps">${st}</div>
    ${BP.master?masterCard():'<div class="hint">レベル9 まで クリアすると「リズムマスター」の カードが もらえるよ</div>'}
    <div class="btns"><button class="bigbtn gray" id="mClose">とじる</button></div>`);
  $('#mClose').onclick=closeModal;
}
function bnRead(){
  if(bnAna()&&!BN.done){const ev=BN.target.flatMap((w,i)=>i===BN.blank?[{d:len(w),r:1,syl:['']}]:w.ev);return playWord({ev},{el:$('#bnBox .lay'),clicks:S.click});}
  if(!BN.items.length)return 0;
  return playWord({ev:BN.items.flatMap(w=>w.ev)},{el:$('#bnBox .lay'),clicks:S.click});
}
$('#bnCardBtn').onclick=bnShowCard;
$('#bnPlay').onclick=()=>{ac();bnRead();};

function genPattern(s){
  if(s.fixed)return s.fixed.map(byId);
  if(s.gen==='one'){const out=[];for(let m=0;m<s.cap/4;m++){const pos=Math.random()*4|0;for(let k=0;k<4;k++)out.push(k===pos?byId(s.pool[Math.random()*s.pool.length|0]):byId('q'));}return out;}
  if(s.seqs){const k=(ST.vpass||0)%s.seqs.length;return s.seqs[k].map(byId);}
  const pool=s.pool.map(byId);
  for(let tries=0;tries<60;tries++){
    let out=[];
    for(let m=0;m<s.cap/4;m++){let rem=4,g=0;
      let lastR=false;
      while(rem>1e-6&&g++<20){let c=pool.filter(w=>len(w)<=rem+1e-6);const isR=w=>w.ev.every(e=>e.r);
        if(lastR){const c2=c.filter(w=>!isR(w));if(c2.length)c=c2;}
        const wt=c.map(w=>(s.must&&s.must.includes(w.id))?2.2:w.ev.every(e=>e.r)?.7:1);
        let r=Math.random()*wt.reduce((a,b)=>a+b,0),p=c[0];for(let i=0;i<c.length;i++){r-=wt[i];if(r<=0){p=c[i];break;}}
        out.push(p);rem-=len(p);lastR=isR(p);}}
    if(out.some((w,i)=>i&&w.ev.every(e=>e.r)&&out[i-1].ev.every(e=>e.r)&&!measStart(out,i)))continue;
    const notes=out.filter(w=>w.ev.some(e=>!e.r)).length;
    if(notes<Math.max(1,out.length/3))continue;
    if(s.must&&!out.some(w=>s.must.includes(w.id)))continue;
    if(ST.items.length&&out.map(w=>w.id).join()===ST.items.map(w=>w.id).join())continue;
    return out;
  }
  return [byId('q'),byId('q'),byId('q'),byId('q')];
}

}

const MIC={on:false,stream:null,node:null,lat:.06,noise:.02,last:0,clicks:[],clickPk:0};
async function micStart(){
  if(MIC.on)return true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    const a=ac();
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
    const src=a.createMediaStreamSource(st);
    const sp=a.createScriptProcessor(512,1,1);
    sp.onaudioprocess=e=>{
      const d=e.inputBuffer.getChannelData(0);let pk=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>pk)pk=v;}
      const now=a.currentTime-e.inputBuffer.duration;
      const nearClick=MIC.clicks.some(c=>Math.abs(now-c-MIC.lat)<.07);
      if(nearClick&&!ST.window){MIC.clickPk=Math.max(pk,MIC.clickPk*.97);}
      const th=Math.max(.18,MIC.noise*6,MIC.clickPk*1.6);
      if(pk>th&&now-MIC.last>.12){MIC.last=now;if(ST.window)stTap(now);}
      else if(!nearClick)MIC.noise=MIC.noise*.98+pk*.02;
      e.outputBuffer.getChannelData(0).fill(0);
    };
    const g=a.createGain();g.gain.value=0;src.connect(sp);sp.connect(g);g.connect(out());
    Object.assign(MIC,{on:true,stream:st,node:sp});
    return true;
  }catch(e){
    const m=$('#stMsg');if(m)m.textContent='マイクが つかえないので タップで やろう';
    return false;
  }
}

function playMel(w,mode){
  // mode 'come'：とおくから ちかづいてくる（おとが こもって 小さい → はっきり 大きい）
  const a=ac(),n=clipName('mel-'+w.mel),b=n&&CLIPS[n],t0=a.currentTime+.05;
  const g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.Q.value=.7;lp.connect(g);g.connect(out());
  const T=7;
  g.gain.setValueAtTime(.05,t0);g.gain.linearRampToValueAtTime(.35,t0+T*.5);g.gain.linearRampToValueAtTime(1,t0+T);
  lp.frequency.setValueAtTime(500,t0);lp.frequency.exponentialRampToValueAtTime(2500,t0+T*.6);lp.frequency.exponentialRampToValueAtTime(18000,t0+T);
  const m={src:null,g,lp,ended:false};
  if(b){const src=a.createBufferSource();src.buffer=b;src.connect(lp);src.start(t0,b._lead||0);m.src=src;src.onended=()=>{m.ended=true;};return m;}
  // ファイルが ないときは リズムを おとで（ながめに）
  const pat={zou:[2,2,2,2],inu:[1,1,1,1,1,1,1,1],risu:Array(16).fill(.5)}[w.mel];
  const B=beat();let t=t0+.05;for(let r=0;r<3;r++)pat.forEach(d=>{tone(t,d*B*.9,lp,w.mel==='zou'?392:w.mel==='inu'?523:784,.4);t+=d*B;});
  setTimeout(()=>{m.ended=true;},(t-a.currentTime)*1000);
  return m;
}

  if(m.lp){const f=m.lp.frequency;f.cancelScheduledValues(n);f.setValueAtTime(Math.max(f.value,2000),n);f.exponentialRampToValueAtTime(400,n+sec);}}

  if(METRO_TYPES.includes(QZ.type))metroStart();nextQ();};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const sameSound=(a,b)=>JSON.stringify(a.ev.map(e=>[e.d,e.r]))===JSON.stringify(b.ev.map(e=>[e.d,e.r]));

/* ---- metronome (ずっと なる) ---- */
function metroStart(){
  metroStop();const a=ac(),B=beat();
  const m={B,g0:a.currentTime+.15,n:0,sess:newSess(),iv:0};QZ.m=m;
  m.sess.gain.value=.75;
  m.iv=setInterval(()=>{const now=a.currentTime;
    while(m.g0+m.n*m.B<now+.25){const t=m.g0+m.n*m.B;if(!QZ.mute)click(t,m.n%4===0,m.sess);m.n++;}},40);
}
function metroStop(){if(QZ.m){clearInterval(QZ.m.iv);killSess(QZ.m.sess);QZ.m=null;}}
function nextBar(t){const m=QZ.m;if(!m)return t;const bar=4*m.B;return m.g0+Math.ceil((t-m.g0)/bar-1e-6)*bar;}
function firstAt(){const a=ac(),m=QZ.m;if(!m)return a.currentTime+.1;return nextBar(a.currentTime+4*m.B*.85);}
function soonAt(){const a=ac();return QZ.m?nextBar(a.currentTime+.08):a.currentTime+.1;}
function qPlay(w,at,el){return playWord(w,{clicks:!QZ.m,el,at,keep:true});}

function pool(){
  if(QZ.type==='longer')return WORDS.filter(w=>w.g===1);
  if(QZ.type==='count')return WORDS.filter(w=>w.g===1||(QZ.rest&&w.g===2));
  let p=WORDS.filter(w=>QZ.groups.has(w.g));
  if(QZ.type==='listen'){const q=p.filter(w=>w.ev.some(e=>!e.r));if(q.length>=2)p=q;}
  return p;
}
function pickChoices(ans,k){
  let others=shuffle(pool().filter(w=>w!==ans&&!sameSound(w,ans)));
  if(others.length<k-1)others=others.concat(shuffle(WORDS.filter(w=>w!==ans&&!others.includes(w)&&w.g!==2)));
  return shuffle([ans].concat(others.slice(0,k-1)));
}
function progHTML(){let h='<div class="qtop"><div class="qprog">';for(let i=0;i<QZ.total;i++)h+=`<i class="${i<QZ.i?'done':i===QZ.i?'now':''}"></i>`;
  h+='</div>';if(QZ.m)h+=`<button class="tog" id="qMute">${QZ.mute?'🔇':'🔈'} カチカチ</button>`;return h+'</div>';}
function bindMute(){const b=$('#qMute');if(b)b.onclick=()=>{QZ.mute=!QZ.mute;b.textContent=(QZ.mute?'🔇':'🔈')+' カチカチ';};}
function choiceCard(w,plain){
  if(plain)return `<button class="qchoice plainn" data-id="${w.id}" style="min-height:130px">${notation(w.ev,2,true,null,true)}</button>`;
  return `<button class="qchoice" data-id="${w.id}">${QZ.show?pic(w,'qemj','font-size:28px'):''}${notation(w.ev,1,true,null,true)}${QZ.show?blocks(w,Math.min(34,Math.floor(130/len(w))),'nolabel'):''}</button>`;
}
function textChoice(id,label,sayKey,sayText,wid){
  return `<div class="qchoice tchoice" data-id="${id}"><button class="qsay" data-k="${sayKey}" data-t="${sayText}" aria-label="きく">🔊</button><div class="w"${wid?` data-wid="${wid}"`:''}>${label}</div></div>`;
}
function bindSay(){$('#qBox').querySelectorAll('.qsay').forEach(b=>b.onclick=e=>{e.stopPropagation();ac();speak(b.dataset.k,b.dataset.t);});}
function pickAns(p){let ans;do{ans=p[Math.random()*p.length|0];}while(p.length>1&&ans===QZ.prev);QZ.prev=ans;return ans;}
const qGood=async(c,after)=>{QZ.lock=true;c.classList.add('good');yay();QZ.score++;addStar();flash('⭕');if(after)await after();await wait(1300);QZ.i++;nextQ();};
const qBad=c=>{c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');buzz();};

async function nextQ(){
  if(!QZ.alive)return;
  if(QZ.i>=QZ.total){showResult();return;}
  QZ.lock=true;const box=$('#qBox');stopPlay();
  /* ⓪ どうぶつさん だれかな？（メロディー） */
  if(QZ.type==='animal'){
    const list=['h','q','ee'].map(byId);const ans=pickAns(list);
    const apic=w=>picName(w)?`<img class="pic" src="${picName(w)}" alt="" style="height:72px">`:`<span style="font-size:60px">${w.ani}</span>`;
    box.innerHTML=progHTML()+`<div class="qprompt" style="font-size:22px">どの どうぶつさんが<br>あそびに きてるかな？</div>
      <div class="btns" style="margin:6px 0 14px"><button class="bigbtn" id="qReplay">🔊 もういちど きく</button></div>
      <div class="qchoices" style="grid-template-columns:repeat(3,1fr)">${shuffle(list).map(w=>`<button class="qchoice" data-id="${w.id}">${apic(w)}<div class="w" style="font-size:20px">${w.anm}</div></button>`).join('')}</div>`;
    let mel=null;
    const play=()=>{stopMel(mel);mel=playMel(ans,'come');QZ.mel=mel;};
    $('#qReplay').onclick=()=>{ac();play();};
    box.querySelectorAll('.qchoice').forEach(c=>c.onclick=async()=>{if(QZ.lock||!QZ.alive)return;
      if(c.dataset.id===ans.id){QZ.lock=true;c.classList.add('good');yay();QZ.score++;addStar();
        const line={zou:'ゾウさんが バイバイって かえって いったよー',inu:'ワンちゃんと いっしょに おさんぽに いこう！',risu:'リスさんは はしって いっちゃった'}[ans.mel];
        if(!mel||mel.ended){mel=playMel(ans,'come');QZ.mel=mel;}fadeMel(mel,4);
        await speak('koe-bye-'+ans.mel,line);await wait(2200);if(!QZ.alive)return;stopMel(mel);QZ.i++;
        if(QZ.i<QZ.total){await speak('koe-tsuginodare','つぎは だれが きたのかな？');}nextQ();}
      else{qBad(c);await speak('koe-chigau','ちがう みたい。もういちど きいてね');if(QZ.alive)play();}});
    await speak('koe-dare','どの どうぶつさんが あそびに きてるかな？');if(!QZ.alive)return;QZ.lock=false;play();
    return;
  }
  /* ① ながいのは どっち？ */
  if(QZ.type==='longer'){
    const p=shuffle(pool()),A=p[0],Bw=p[1],askLong=Math.random()<.65;QZ.prev=null;
    QZ.ans=askLong?(len(A)>len(Bw)?A:Bw):(len(A)<len(Bw)?A:Bw);
    box.innerHTML=progHTML()+`<div class="qprompt">${askLong?'ながいのは どっち？':'みじかいのは どっち？'}</div>
      <div class="btns" style="margin-bottom:14px"><button class="bigbtn" id="qReplay" style="font-size:24px">🔊 もういちど きく</button></div>
      <div class="qchoices" style="grid-template-columns:1fr 1fr">${[A,Bw].map(w=>choiceCard(w)).join('')}</div>`;
    bindMute();
    const cards=[...box.querySelectorAll('.qchoice')];
    const playBoth=async(first)=>{QZ.lock=true;const B=QZ.m?QZ.m.B:beat();let at=first?firstAt():soonAt();
      for(let i=0;i<2;i++){if(!QZ.alive)return;const t=at+i*4*B;
        setTimeout(()=>{cards.forEach(c=>c.classList.remove('lit'));cards[i].classList.add('lit');},(t-ac().currentTime)*1000);
        qPlay([A,Bw][i],t,QZ.show?cards[i].querySelector('.blocks'):null);}
      await wait((at+8*B-ac().currentTime)*1000);cards.forEach(c=>c.classList.remove('lit'));if(QZ.alive)QZ.lock=false;};
    $('#qReplay').onclick=()=>{if(!QZ.lock)playBoth(false);};
    box.querySelectorAll('.qchoice').forEach(c=>c.onclick=()=>{if(QZ.lock||!QZ.alive)return;const w=byId(c.dataset.id);
      if(w===QZ.ans)qGood(c);else qBad(c);});
    await P(askLong?'nagai':'mijikai');if(!QZ.alive)return;await playBoth(true);
  }
  /* ② どの おとかな？ */
  else if(QZ.type==='listen'){
    const ans=pickAns(pool());const ch=pickChoices(ans,QZ.choices);QZ.ans=ans;
    box.innerHTML=progHTML()+`<div class="qprompt">${ch.length===2?'どっちの ながさかな？':'どの ながさかな？'}</div>
      <div class="btns" style="margin-bottom:14px"><button class="bigbtn" id="qReplay" style="font-size:26px">🔊 もういちど きく</button></div>
      <div class="qchoices">${ch.map(w=>choiceCard(w,true)).join('')}</div>`;
    bindMute();
    const play=async first=>{QZ.lock=true;const at=first?firstAt():soonAt();qPlay(ans,at);await wait((at+len(ans)*(QZ.m?QZ.m.B:beat())-ac().currentTime)*1000+150);if(QZ.alive)QZ.lock=false;};
    $('#qReplay').onclick=()=>{if(!QZ.lock)play(false);};
    box.querySelectorAll('.qchoice').forEach(c=>c.onclick=async()=>{if(QZ.lock||!QZ.alive)return;const w=byId(c.dataset.id);
      if(w===ans||sameSound(w,ans))qGood(c);else{qBad(c);await wait(500);if(QZ.alive)play(false);}});
    await P(ch.length===2?'docchinagasa':'donagasa');if(!QZ.alive)return;await play(true);
  }
  /* ③ たん なんこ ぶん？ */
  else if(QZ.type==='count'){
    const ans=pickAns(pool());QZ.ans=ans;const n=len(ans),r=ans.ev[0].r;
    const u=Math.min(70,Math.floor((availW()-40)/4));
    box.innerHTML=progHTML()+`<div class="qprompt">${r?'いくつ おやすみ？':'いくつ のばす？'}</div>
      <div class="qnote" id="qcNote" style="flex-direction:column;align-items:center;gap:8px">${notation(ans.ev,2,true,null,true)}<div id="qcB"></div></div>
      <div class="btns" style="margin-bottom:12px"><button class="bigbtn" id="qReplay">🔊 きく</button></div>
      <div class="qchoices" style="grid-template-columns:repeat(4,1fr)">${[1,2,3,4].map(k=>`<button class="qchoice qnum" data-n="${k}"><div class="w">${k}</div></button>`).join('')}</div>`;
    bindMute();
    const showB=()=>{$('#qcB').innerHTML=blocks(ans,u,'nolabel');};
    const play=async first=>{QZ.lock=true;const at=first?firstAt():soonAt();const el=$('#qcB .blocks');qPlay(ans,at,el);
      await wait((at+n*(QZ.m?QZ.m.B:beat())-ac().currentTime)*1000+150);if(QZ.alive)QZ.lock=false;};
    $('#qReplay').onclick=()=>{if(!QZ.lock)play(false);};
    let miss=0;
    box.querySelectorAll('.qnum').forEach(c=>c.onclick=()=>{if(QZ.lock||!QZ.alive)return;const k=+c.dataset.n;
      if(k===n)qGood(c,async()=>{$('#qcB').innerHTML=tanRow(ans,u)+blocks(ans,u,'nolabel');speak('koe-'+ans.k,`${r?'うん':'たん'} ${n}こ`);await wait(500);});
      else{qBad(c);miss++;if(miss===1){showB();$('#qcB').insertAdjacentHTML('beforeend','<div class="hint" style="margin:4px 0 0">ヒント：つみきを かぞえてみよう</div>');}}});
    await P('nanko');if(!QZ.alive)return;await play(true);
  }
  /* ④ なまえを おぼえよう */
  else if(QZ.type==='name'){
    const list=NAMEQ.concat(QZ.rest?NAMEQR:[]);const ans=pickAns(list);
    const others=shuffle(list.filter(x=>x!==ans)).slice(0,3);const ch=shuffle([ans,...others]);
    const key=x=>'na-'+(x.nk||(byId(x.id)||{}).nk||x.id);
    box.innerHTML=progHTML()+`<div class="qprompt">これは なに？</div>
      <button class="qnote qtapnote" id="qNameNote">${notation(ans.ev,2.4,true,null,true)}<div class="hint" style="margin:0">ここを おすと おしえてくれるよ</div><span class="hfing">👈</span></button>
      <div class="qchoices tlist">${ch.map(x=>textChoice(x.id,x.nm,key(x),x.nm)).join('')}</div>`;
    const nn=$('#qNameNote');nn.classList.add(QZ.hintSeen?'hglow1':'hglow');
    const stopHint=()=>{nn.classList.remove('hglow','hglow1');};
    nn.onclick=()=>{ac();stopHint();QZ.hintSeen=true;speak(key(ans),ans.nm);};
    box.querySelectorAll('.tchoice').forEach(c=>c.addEventListener('pointerdown',stopHint));
    bindSay();
    box.querySelectorAll('.tchoice').forEach(c=>c.onclick=()=>{if(QZ.lock||!QZ.alive)return;
      if(c.dataset.id===ans.id)qGood(c,async()=>{speak(key(ans),ans.nm);});else qBad(c);});
    await P('koreha');QZ.lock=false;
  }
  /* ⑤ リズムを うたおう（うたう → ずんだもんと くらべる） */
  else if(QZ.sing){
    const ans=pickAns(pool());QZ.ans=ans;
    const u=Math.min(60,Math.floor((availW()-60)/Math.max(1,len(ans))));
    box.innerHTML=progHTML()+`<div class="qprompt">くちで うたって みよう</div>
      <div class="qnote singbox">${notation(ans.ev,len(ans)<1?3:2,true,null,true)}<div id="qsB"></div></div>
      <div class="btns" id="qsBtns"><button class="bigbtn" id="qsAns" style="background:var(--c3);font-size:22px">🔊 うたったら おしてね</button></div>`;
    const sing=async()=>{QZ.lock=true;$('#qsB').innerHTML=blocks(ans,u);
      const a=ac(),t0=a.currentTime+.25;const save=ST.items;ST.items=[ans];const sess=newSess();try{scheduleSyl(t0,sess);}catch(e){}ST.items=save;
      await wait(playWord(ans,{at:t0,keep:true,clicks:true,el:$('#qsB .blocks')}));if(QZ.alive)QZ.lock=false;};
    $('#qsAns').onclick=async()=>{if(QZ.lock||!QZ.alive)return;ac();await sing();if(!QZ.alive)return;
      $('#qsBtns').innerHTML=`<button class="bigbtn" id="qsOk" style="background:var(--c3)">⭕ できた</button><button class="bigbtn" id="qsRe">🔁 もういちど</button>`;
      P('utattara');
      $('#qsOk').onclick=()=>{if(QZ.lock||!QZ.alive)return;qGood($('#qsOk'));};
      $('#qsRe').onclick=()=>{if(QZ.lock||!QZ.alive)return;sing();};};
    await P('utaou');QZ.lock=false;
  }
  /* ⑤' ことばを えらぶ */
  else{
    const ans=pickAns(pool());QZ.ans=ans;
    const ch=pickChoices(ans,4);
    const u=Math.min(60,Math.floor((availW()-60)/Math.max(1,len(ans))));
    box.innerHTML=progHTML()+`<div class="qprompt">なんて うたうかな？</div>
      <button class="qnote qtapnote" id="qWordNote">${notation(ans.ev,len(ans)<1?3:2,true,null,true)}<div id="qwB"></div><div class="hint" style="margin:0">👆 おんぷを おすと リズムが なるよ</div></button>
      <div class="qchoices tlist">${ch.map(w=>textChoice(w.id,W(w),'koe-'+w.k,w.w,w.id)).join('')}</div>`;
    $('#qWordNote').onclick=()=>{ac();playWord(ans,{clicks:true,el:$('#qwB .blocks')});};
    bindSay();
    box.querySelectorAll('.tchoice').forEach(c=>c.onclick=()=>{if(QZ.lock||!QZ.alive)return;
      if(c.dataset.id===ans.id)qGood(c,async()=>{$('#qwB').innerHTML=blocks(ans,u);await wait(80);speak('koe-'+ans.k,ans.w);await wait(playWord(ans,{clicks:true,el:$('#qwB .blocks')}));});
      else qBad(c);});
    QZ.lock=false;
  }
}
function flash(t){const o=$('#ov');o.innerHTML=`<span>${t}</span>`;setTimeout(()=>o.innerHTML='',800);}
function showResult(){
  QZ.alive=false;metroStop();const all=QZ.score===QZ.total;
  $('#qBox').innerHTML=`<div class="result"><div class="big">${'⭐'.repeat(QZ.score)||'🌱'}</div>
    <div class="t">${all?'ぜんぶ できたね！':'よく がんばったね！'}</div>
    <div class="btns"><button class="bigbtn" id="qAgain" style="background:var(--c3)">もういちど</button>
    <button class="bigbtn gray" id="qEnd">おわり</button></div></div>`;
  yay();P(all?'zenbu':'ganbatta');
  if(all&&QZ.type==='name'&&QZ.rest&&!(CS.cards||{}).B){CS.cards=CS.cards||{};CS.cards.B=today();csSave();const ms=MASTERS.find(m=>m.key==='B');
    setTimeout(()=>{openModal(`<h3>🎉 ${ms.name}！</h3>${masterCardHTML(ms,CS.cards.B).replace('mcard2','mcard2 award')}<div class="hint">この がめんを せんせいに みせてね</div><div class="btns"><button class="bigbtn gray" id="mClose">とじる</button></div>`);$('#mClose').onclick=closeModal;P('master');},1200);}
  $('#qAgain').onclick=()=>{ac();QZ.i=0;QZ.score=0;QZ.alive=true;if(METRO_TYPES.includes(QZ.type))metroStart();nextQ();};
  $('#qEnd').onclick=()=>go('menu');
}
probeFiles();
renderHome();
$('#verLbl').textContent='版：'+VERSION;

</script>
