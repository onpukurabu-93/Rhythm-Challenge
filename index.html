<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>リズムカード</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 15px 10px;
    }
    .active { display: flex; }

    /* 文字サイズを大幅に大きく変更 */
    .menu-title { font-size: 32px; font-weight: bold; color: #333; margin-top: 20px; }
    .level-list { width: 90%; max-width: 340px; display: flex; flex-direction: column; gap: 15px; }
    .level-btn {
      background: #ffffff;
      border: 4px solid #4ea8de;
      padding: 18px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .header-title { font-size: 28px; font-weight: bold; color: #333; margin: 0; text-align: center; }
    .swiper-container { width: 100%; height: 48vh; display: flex; align-items: center; justify-content: center; }
    .card-container { width: 85vw; max-width: 320px; height: 100%; max-height: 380px; perspective: 1000px; cursor: pointer; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.12); border-radius: 24px; }
    .card-container.flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; background: #ffffff; display: flex; align-items: center; justify-content: center; border: 4px solid #e2e8f0; box-sizing: border-box; }
    .card-back { transform: rotateY(180deg); }
    .card-img { width: 85%; height: 85%; object-fit: contain; }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-15px); }
      40% { transform: translateX(15px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: shake 0.4s ease; }

    .overlay {
      position: absolute;
      font-size: 140px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .overlay.correct { color: #2ed573; opacity: 1; }
    .overlay.wrong { color: #ff4757; opacity: 1; }

    .btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.95); background: #ff4757; }
    .btn-menu { background: #a4b0be; margin-top: 8px; }

    /* 表示テキスト枠を大きく見やすく */
    .debug-box {
      font-size: 22px;
      font-weight: bold;
      color: #2d3748;
      background: #edf2f7;
      padding: 10px 16px;
      border-radius: 12px;
      margin-top: 8px;
      min-height: 32px;
      text-align: center;
    }
    
    .score-box {
      font-size: 18px;
      font-weight: bold;
      color: #4a5568;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- 1. メニュー画面 -->
  <div id="screenMenu" class="screen active">
    <h1 class="menu-title">リズムのおんがく</h1>
    <div class="level-list">
      <div class="level-btn" onclick="startLevel(1)">
        <span>Lv.1 おんぷ</span>
        <span>🔓</span>
      </div>
      <div class="level-btn" id="btnLv2" style="opacity: 0.5;" onclick="startLevel(2)">
        <span>Lv.2 きゅうふ</span>
        <span id="lockLv2">🔒</span>
      </div>
      <div class="level-btn" id="btnLv3" style="opacity: 0.5;" onclick="startLevel(3)">
        <span>Lv.3 ふてん</span>
        <span id="lockLv3">🔒</span>
      </div>
    </div>
    <div></div>
  </div>

  <!-- 2. 練習モード -->
  <div id="screenPractice" class="screen">
    <div style="text-align:center;">
      <h1 class="header-title" id="practiceTitle">Lv.1 れんしゅう</h1>
    </div>
    <div class="swiper-container" id="swipeArea">
      <div class="card-container" id="cardContainer" onclick="flipCard()">
        <div class="card-inner" id="cardInner">
          <div class="card-front"><img id="imgFront" class="card-img" src="" alt="おもて"></div>
          <div class="card-back"><img id="imgBack" class="card-img" src="" alt="うら"></div>
        </div>
      </div>
    </div>
    <div style="text-align: center; margin-bottom: 20px;">
      <button class="btn" onclick="startTraining()">🎤 トレーニング</button><br>
      <button class="btn btn-menu" onclick="showMenu()">もどる</button>
    </div>
  </div>

  <!-- 3. トレーニングモード -->
  <div id="screenTraining" class="screen">
    <div style="text-align:center;">
      <h1 class="header-title" id="trainingTitle">Lv.1 トレーニング</h1>
      <div id="scoreBox" class="score-box">1 / 10 もんめ</div>
      <div id="debugBox" class="debug-box">こたえてね</div>
    </div>
    <div class="swiper-container" style="position: relative;">
      <div class="card-container" id="quizCardContainer" onclick="togglePause()">
        <div class="card-inner" id="quizCardInner">
          <div class="card-front"><img id="quizImg" class="card-img" src="" alt="問題"></div>
        </div>
      </div>
      <div id="markOverlay" class="overlay"></div>
    </div>
    <div style="text-align: center; margin-bottom: 20px;">
      <button id="pauseBtn" class="btn" style="background:#e2e8f0; color:#333;" onclick="togglePause()">⏸️ いちじていし</button><br>
      <button class="btn btn-menu" onclick="stopTrainingAndGoMenu()">おわる</button>
    </div>
  </div>

  <script>
    // カードデータ構造
    const allCards = {
      1: [
        { id: '4bu', hiraganaAnswers: ['しぶおんぷ', 'しぶんおんぷ', 'しぶ', 'しぶん'], rescueAnswers: ['ぶおんぷ', 'ぶんおんぷ', 'ぶ', 'ぶん'], front: 'onpu5-4bu1.png', back: 'onpu5-4bu2.png' },
        { id: '2bu', hiraganaAnswers: ['にぶおんぷ', 'にぶんおんぷ', 'にぶ', 'にぶん'], rescueAnswers: [], front: 'onpu3-2bu1.png', back: 'onpu3-2bu2.png' },
        { id: 'zen', hiraganaAnswers: ['ぜんおんぷ', 'ぜん'], rescueAnswers: [], front: 'onpu1-zen1.png', back: 'onpu1-zen2.png' },
        { id: '8bu', hiraganaAnswers: ['はちぶおんぷ', 'はちぶんおんぷ', 'はちぶ', 'はちぶん'], rescueAnswers: [], front: 'onpu7-8bu1.png', back: 'onpu7-8bu2.png' },
        { id: '16bu', hiraganaAnswers: ['じゅうろくぶおんぷ', 'じゅうろくぶんおんぷ', 'じゅうろくぶ', 'じゅうろくぶん'], rescueAnswers: [], front: 'onpu10-16bu1.png', back: 'onpu10-16bu2.png' }
      ],
      2: [
        { id: '4kyu', hiraganaAnswers: ['しぶきゅうふ', 'しぶんきゅうふ', 'しぶ', 'しぶん'], rescueAnswers: ['ぶきゅうふ', 'ぶんきゅうふ'], front: 'kyuufu5-4bu1.png', back: 'kyuufu5-4bu2.png' },
        { id: '2kyu', hiraganaAnswers: ['にぶきゅうふ', 'にぶんきゅうふ', 'にぶ', 'にぶん'], rescueAnswers: [], front: 'kyuufu3-2bu1.png', back: 'kyuufu3-2bu2.png' },
        { id: 'zenkyu', hiraganaAnswers: ['ぜんきゅうふ', 'ぜん'], rescueAnswers: [], front: 'kyuufu1-zen1.png', back: 'kyuufu1-zen2.png' },
        { id: '8kyu', hiraganaAnswers: ['はちぶきゅうふ', 'はちぶんきゅうふ', 'はちぶ', 'はちぶん'], rescueAnswers: [], front: 'kyuufu7-8bu1.png', back: 'kyuufu7-8bu2.png' },
        { id: '16kyu', hiraganaAnswers: ['じゅうろくぶきゅうふ', 'じゅうろくぶんきゅうふ', 'じゅうろくぶ', 'じゅうろくぶん'], rescueAnswers: [], front: 'kyuufu9-16bu1.png', back: 'kyuufu9-16bu3.png' }
      ]
    };

    let currentLevel = 1;
    let unlockedLevel = 1;
    let cards = [];

    let currentIndex = 0;
    let quizIndex = -1;
    let lastQuizIndex = -1;
    let recognition = null;
    let isPaused = false;
    let nextTimer = null;
    let isTrainingActive = false;

    // チャレンジ達成用カウント
    let questionCount = 0;
    let correctCount = 0;
    let totalQuestions = 10;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // サウンド再生（ピンポンを追加）
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'tap') {
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'correct') {
        // 明るい高音の「ピンポン♪」（2音連続）
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        const gain2 = audioCtx.createGain();

        osc1.connect(gain1); gain1.connect(audioCtx.destination);
        osc2.connect(gain2); gain2.connect(audioCtx.destination);

        // ミ (E5) ➔ ラ (A5)
        osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc2.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);

        osc1.start(audioCtx.currentTime); osc1.stop(audioCtx.currentTime + 0.3);
        osc2.start(audioCtx.currentTime + 0.15); osc2.stop(audioCtx.currentTime + 0.55);

      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function showScreen(id) {
      playSound('tap');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showMenu() {
      isTrainingActive = false;
      if (recognition) recognition.abort();
      showScreen('screenMenu');
    }

    function startLevel(lv) {
      if (lv > unlockedLevel) return;
      currentLevel = lv;
      cards = allCards[lv] || allCards[1];
      totalQuestions = (lv === 3) ? 20 : 10;

      document.getElementById('practiceTitle').innerText = `Lv.${lv} れんしゅう`;
      document.getElementById('trainingTitle').innerText = `Lv.${lv} トレーニング`;

      showScreen('screenPractice');
      currentIndex = 0;
      updatePracticeCard();
    }

    function updatePracticeCard() {
      const container = document.getElementById('cardContainer');
      container.classList.remove('flipped');
      setTimeout(() => {
        document.getElementById('imgFront').src = cards[currentIndex].front;
        document.getElementById('imgBack').src = cards[currentIndex].back;
      }, 150);
    }
    function flipCard() { playSound('tap'); document.getElementById('cardContainer').classList.toggle('flipped'); }

    let startX = 0;
    const swipeArea = document.getElementById('swipeArea');
    swipeArea.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
    swipeArea.addEventListener('touchend', e => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) {
        currentIndex = diff > 0 ? (currentIndex + 1) % cards.length : (currentIndex - 1 + cards.length) % cards.length;
        updatePracticeCard();
      }
    });

    // 文字正規化（不自然な文字化け防止）
    function normalizeToHiragana(text) {
      let t = text
        .replace(/4|四/g, 'し')
        .replace(/2|二/g, 'に')
        .replace(/8|八/g, 'はち')
        .replace(/16|十六/g, 'じゅうろく')
        .replace(/分|部|支部|市部|私部|渋/g, 'ぶ')
        .replace(/全/g, 'ぜん')
        .replace(/休符|給付/g, 'きゅうふ')
        .replace(/音符/g, 'おんぷ');

      // 「8ぶおんぷ」等の数字混ざりを綺麗に整形
      if (t.includes('はちぶ')) return t.includes('きゅうふ') ? 'はちぶきゅうふ' : 'はちぶおんぷ';
      if (t.includes('しぶ')) return t.includes('きゅうふ') ? 'しぶきゅうふ' : 'しぶおんぷ';
      if (t.includes('にぶ')) return t.includes('きゅうふ') ? 'にぶきゅうふ' : 'にぶおんぷ';
      if (t.includes('じゅうろくぶ')) return t.includes('きゅうふ') ? 'じゅうろくぶきゅうふ' : 'じゅうろくぶおんぷ';
      if (t.includes('ぜん')) return t.includes('きゅうふ') ? 'ぜんきゅうふ' : 'ぜんおんぷ';

      return t;
    }

    function startTraining() {
      isTrainingActive = true;
      isPaused = false;
      questionCount = 0;
      correctCount = 0;
      lastQuizIndex = -1;
      document.getElementById('pauseBtn').innerText = "⏸️ いちじていし";
      showScreen('screenTraining');
      nextQuestion();
    }

    function nextQuestion() {
      if (!isTrainingActive || isPaused) return;

      if (questionCount >= totalQuestions) {
        finishTraining();
        return;
      }

      questionCount++;
      document.getElementById('scoreBox').innerText = `${questionCount} / ${totalQuestions} もんめ`;

      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * cards.length);
      } while (cards.length > 1 && newIndex === lastQuizIndex);

      quizIndex = newIndex;
      lastQuizIndex = quizIndex;

      document.getElementById('quizImg').src = cards[quizIndex].front;
      document.getElementById('debugBox').innerText = "こたえてね";
      
      startListening();
    }

    function startListening() {
      if (!isTrainingActive || isPaused) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("お使いのブラウザは音声認識に対応していません");
        return;
      }

      if (recognition) recognition.abort();
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';

      recognition.onresult = (e) => {
        if (isPaused) return;
        const rawText = e.results[0][0].transcript;
        const normalizedText = normalizeToHiragana(rawText);
        const card = cards[quizIndex];

        document.getElementById('debugBox').innerText = normalizedText;

        const isMatchStandard = card.hiraganaAnswers.some(ans => normalizedText.includes(ans));
        const isMatchRescue = card.rescueAnswers.some(ans => normalizedText === ans || normalizedText.includes(ans));
        
        const isCorrect = isMatchStandard || isMatchRescue;
        showResult(isCorrect, normalizedText);
      };

      recognition.onerror = () => {
        if (!isPaused && isTrainingActive) {
          document.getElementById('debugBox').innerText = "もういちど お話ししてね！";
          setTimeout(startListening, 1000);
        }
      };

      recognition.start();
    }

    function showResult(isCorrect, userText) {
      const overlay = document.getElementById('markOverlay');
      const cardInner = document.getElementById('quizCardInner');

      if (isCorrect) {
        correctCount++;
        overlay.innerText = '⭕️';
        overlay.className = 'overlay correct';
        playSound('correct');

        nextTimer = setTimeout(() => {
          overlay.className = 'overlay';
          if (!isPaused && isTrainingActive) {
            nextQuestion();
          }
        }, 1800);

      } else {
        // 不正解時は自動進行させず、同じ問題で言い直し
        overlay.innerText = '❌';
        overlay.className = 'overlay wrong';
        cardInner.classList.add('shake');
        playSound('wrong');

        isPaused = true;
        document.getElementById('pauseBtn').innerText = "▶️ つづける";

        setTimeout(() => {
          overlay.className = 'overlay';
          cardInner.classList.remove('shake');
        }, 1500);
      }
    }

    function finishTraining() {
      isTrainingActive = false;
      const passRate = (correctCount / totalQuestions) * 100;

      if (passRate >= 90) {
        alert(`すごーい！ ${totalQuestions}もんちゅう ${correctCount}もん せいかい！\nクリアおめでとう！🎉`);
        if (currentLevel === unlockedLevel && unlockedLevel < 3) {
          unlockedLevel++;
          if (unlockedLevel >= 2) {
            document.getElementById('btnLv2').style.opacity = '1';
            document.getElementById('lockLv2').innerText = '🔓';
          }
          if (unlockedLevel >= 3) {
            document.getElementById('btnLv3').style.opacity = '1';
            document.getElementById('lockLv3').innerText = '🔓';
          }
        }
      } else {
        alert(`${totalQuestions}もんちゅう ${correctCount}もん せいかい！\nあとすこし！もういちど チャレンジしよう！`);
      }
      showMenu();
    }

    function togglePause() {
      playSound('tap');
      isPaused = !isPaused;
      const pauseBtn = document.getElementById('pauseBtn');

      if (isPaused) {
        if (recognition) recognition.abort();
        clearTimeout(nextTimer);
        pauseBtn.innerText = "▶️ つづける";
      } else {
        pauseBtn.innerText = "⏸️ いちじていし";
        startListening(); // 同じ問題でマイクを再開
      }
    }

    function stopTrainingAndGoMenu() {
      isTrainingActive = false;
      isPaused = false;
      clearTimeout(nextTimer);
      if (recognition) recognition.abort();
      showMenu();
    }
  </script>
</body>
</html>
