<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リズムカード - レベル1</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background-color: #f7f9fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 90vh;
      box-sizing: border-box;
    }
    .header { text-align: center; }
    .header h1 { font-size: 22px; color: #333; margin: 0 0 5px; }
    .header p { font-size: 14px; color: #666; margin: 0; }
    
    .card-container {
      width: 280px;
      height: 280px;
      perspective: 1000px;
      margin: 15px 0;
      cursor: pointer;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      border-radius: 20px;
    }
    .card-container.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #e0e0e0;
      box-sizing: border-box;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .card-img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      background-color: #ff6b6b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-prev { background-color: #74b9ff; }
    .btn-next { background-color: #0984e3; }
    .counter {
      font-size: 14px;
      color: #555;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>レベル1：基本のおんぷ・きゅうふ</h1>
    <p>タップして「うら（なまえ・ながさ）」をみよう！</p>
  </div>

  <div class="card-container" id="cardContainer" onclick="flipCard()">
    <div class="card-inner">
      <div class="card-front">
        <img id="imgFront" class="card-img" src="" alt="おもて">
      </div>
      <div class="card-back">
        <img id="imgBack" class="card-img" src="" alt="うら">
      </div>
    </div>
  </div>

  <div class="counter" id="cardCounter">1 / 10</div>

  <div class="controls">
    <button class="btn btn-prev" onclick="prevCard()">まえ</button>
    <button class="btn" onclick="flipCard()">めくる</button>
    <button class="btn btn-next" onclick="nextCard()">つぎ</button>
  </div>

  <script>
    // レベル1用リスト（基本音符・休符のみ、付点・複数連結・16分除外）
    const cards = [
      // 基本音符
      { front: 'onpu1-zen1.png', back: 'onpu1-zen2.png' },       // 全音符
      { front: 'onpu3-2bu1.png', back: 'onpu3-2bu2.png' },       // 2分音符
      { front: 'onpu5-4bu1.png', back: 'onpu5-4bu2.png' },       // 4分音符
      { front: 'onpu7-8bu1.png', back: 'onpu7-8bu2.png' },       // 8分音符

      // 基本休符
      { front: 'kyuufu1-zen1.png', back: 'kyuufu1-zen2.png' },   // 全休符
      { front: 'kyuufu3-2bu1.png', back: 'kyuufu3-2bu2.png' },   // 2分休符
      { front: 'kyuufu5-4bu1.png', back: 'kyuufu5-4bu2.png' },   // 4分休符
      { front: 'kyuufu7-8bu1.png', back: 'kyuufu7-8bu2.png' },   // 8分休符
      { front: 'kyuufu9-16bu1.png', back: 'kyuufu9-16bu3.png' }  // 16分休符
    ];

    let currentIndex = 0;
    const container = document.getElementById('cardContainer');
    const imgFront = document.getElementById('imgFront');
    const imgBack = document.getElementById('imgBack');
    const counter = document.getElementById('cardCounter');

    function updateCard() {
      container.classList.remove('flipped');
      setTimeout(() => {
        imgFront.src = cards[currentIndex].front;
        imgBack.src = cards[currentIndex].back;
        counter.innerText = `${currentIndex + 1} / ${cards.length}`;
      }, 200);
    }

    function flipCard() {
      container.classList.toggle('flipped');
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % cards.length;
      updateCard();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      updateCard();
    }

    // 初回読み込み
    updateCard();
  </script>
</body>
</html>
