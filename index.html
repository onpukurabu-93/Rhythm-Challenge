<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>リズムチャレンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ea;--ink:#3b2f2a;--sub:#8a7a70;--card:#fff;--line:#eadcc8;
  --c1:#ec6450;--c2:#eaa317;--c3:#4fb172;--c4:#3f92dc;--c8:#f07f2e;--c16:#d4609f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100vh}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:2px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:800;flex:1;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo{display:inline-flex;gap:2px}
.logo i{display:block;width:12px;height:16px;border-radius:3px}
#backBtn{border:none;background:#fff;border-radius:14px;width:48px;height:44px;font-size:24px;
  box-shadow:0 3px 0 var(--line);visibility:hidden}
#stars{font-weight:800;font-size:18px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 var(--line)}
.view{display:none;max-width:780px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
.view.on{display:block}
h2{font-size:22px;margin:6px 0 12px}
.hint{color:var(--sub);font-size:14px;margin:4px 0 12px}

/* home */
.tiles{display:grid;gap:14px}
.tile{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:26px;border:none;
  font-size:24px;font-weight:800;color:#fff;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .em{font-size:44px;line-height:1}
.tile small{display:block;font-size:14px;font-weight:500;opacity:.95;margin-top:2px}
.tile.soon{background:#e3d8c8 !important;color:#8a7a70;box-shadow:none;cursor:default}
.settings{margin-top:22px;background:#fff;border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:0 3px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .lab{min-width:96px;font-weight:800}
.seg{display:inline-flex;background:#f3eadc;border-radius:14px;padding:3px}
.seg button{border:none;background:none;padding:8px 14px;border-radius:11px;font-weight:800;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:none;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px;
  box-shadow:0 3px 0 var(--line);color:var(--sub)}
#nbChips .chip{font-size:14px;padding:7px 11px}
.chip.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:none;border-radius:20px;padding:12px 10px 14px;box-shadow:0 4px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .1s}
.card:active{transform:scale(.97)}
.card .w{font-size:20px;font-weight:800}
.card .emj{font-size:26px;line-height:1}
.card svg{max-width:100%;height:auto}

/* blocks */
.blocks{display:flex;align-items:flex-end;justify-content:center}
.ev{display:flex;gap:2px;margin:0 3px}
.blk{flex:none;width:calc(var(--u)*var(--d) - 2px);height:var(--bh,calc(var(--u)*.72));border-radius:calc(min(var(--u),95px)*.12);
  background:var(--c);border:2px solid rgba(0,0,0,.14);border-bottom-width:5px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  font-size:calc(var(--u)*.27*min(1,var(--d)*1.7));text-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:opacity .12s,transform .12s;white-space:nowrap;overflow:hidden}
.blk.rest{background:#fff;border:3px dashed var(--c);color:var(--c);text-shadow:none}
.nolabel .blk{font-size:0}
.playing .blk{opacity:.28}
.playing .blk.on{opacity:1;transform:translateY(calc(var(--u)*-.1))}

/* detail */
.detail{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.detail .notebox{background:#fff;border-radius:22px;padding:8px 14px;box-shadow:0 4px 0 var(--line);width:100%;display:flex;justify-content:center}
.detail .emj{font-size:40px;line-height:1}
.pic{display:block;object-fit:contain;height:1.5em;width:auto;max-width:5em;margin:0 auto}
.detail .emj .pic{height:min(90px,12vh)}
.notebox svg,.nb-top svg{max-height:min(84px,11vh);width:auto !important}
.notebox svg{max-height:min(104px,14vh)}
.detail .word{font-size:32px;font-weight:800;letter-spacing:.04em}
.pager{display:flex;align-items:center;gap:14px;margin-top:4px}.arw{border:none;background:#fff;border-radius:14px;width:52px;height:44px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.dots{display:flex;gap:7px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#e2d5c2}.dots i.on{background:var(--ink)}
.sylNow{height:56px;font-size:46px;font-weight:800;color:var(--c4)}
.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dbtns{flex-wrap:nowrap;gap:8px}.dbtns .bigbtn{padding:11px 13px;font-size:17px;white-space:nowrap}
.bigbtn{border:none;border-radius:18px;padding:12px 18px;font-size:19px;font-weight:800;color:#fff;
  background:var(--c4);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bigbtn.gray{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}

/* nobashi */
.nb-top{display:flex;flex-direction:column;align-items:center;gap:8px}
.track{position:relative;margin:10px auto 0;height:calc(var(--u)*.8)}
.track .slot{position:absolute;top:0;height:100%;width:calc(var(--u) - 4px);border-radius:calc(var(--u)*.12);
  border:3px dashed #d8cbb8;display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:calc(var(--u)*.27);color:transparent;z-index:2;transition:color .1s}
.track.hint .slot.tg{border:3px solid var(--c);border-style:dashed}
.track .slot.extra{border-color:#eee2d2}
.track .slot.passed{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.track .slot.passed.extra{color:#b9a995}
.track .fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:calc(var(--u)*.12);background:var(--c);z-index:1}
.track.reach .slot.tg{border-color:#fff;border-style:solid;animation:glow .5s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 5px rgba(79,177,114,.55)}}
.nb-msg{min-height:58px;font-size:22px;font-weight:800;text-align:center;margin:8px 0 6px}
.nb-msg small{display:block;font-size:16px;color:var(--sub);font-weight:500}
.holdwrap{display:flex;justify-content:center;margin:6px 0 16px}
.hold{width:min(50vw,200px,25vh);height:min(50vw,200px,25vh);border-radius:50%;border:none;color:#fff;font-size:30px;font-weight:800;
  background:radial-gradient(circle at 35% 30%,#ff9a85,var(--c1));box-shadow:0 10px 0 #b8432f;touch-action:none;
  transition:transform .06s}
.hold.down{transform:translateY(8px) scale(.97);box-shadow:0 2px 0 #b8432f}
.hold.count{background:radial-gradient(circle at 35% 30%,#8ec5f2,var(--c4));box-shadow:0 10px 0 #2b6ca8;font-size:56px}
.nb-sylnow{height:52px;font-size:44px;font-weight:800;text-align:center;color:var(--ink)}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tog{border:none;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 3px 0 var(--line);color:var(--sub)}
.tog.on{color:var(--ink)}
.tog .box{display:inline-block;width:20px;height:20px;border-radius:6px;border:2px solid #cbbba6;vertical-align:-4px;margin-right:6px}
.tog.on .box{background:var(--c3);border-color:var(--c3)}

/* quiz */
.qtypes{display:grid;gap:12px;margin-bottom:16px}
.qtype{display:flex;align-items:center;gap:14px;border:3px solid transparent;background:#fff;border-radius:20px;padding:14px;
  text-align:left;box-shadow:0 4px 0 var(--line);font-size:20px;font-weight:800}
.qtype .em{font-size:36px}
.qtype small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.qtype.on{border-color:var(--ink)}
.qprompt{text-align:center;font-size:26px;font-weight:800;margin:6px 0 10px}
.qprog{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.qprog i{width:14px;height:14px;border-radius:50%;background:#e6dac8}
.qprog i.done{background:var(--c2)}
.qprog i.now{background:var(--ink)}
.qnote{display:flex;justify-content:center;background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.qchoices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.qchoice{background:#fff;border:4px solid transparent;border-radius:22px;padding:14px 8px;box-shadow:0 4px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px;justify-content:center}
.qchoice .w{font-size:26px;font-weight:800}
.qchoice.lit{border-color:var(--c4)}
.qchoice.good{border-color:var(--c3);background:#eaf8ef}
.qchoice.bad{animation:shake .4s}
.qchoice[disabled]{opacity:1}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.result{text-align:center;padding:30px 0}
.result .big{font-size:64px}
.result .t{font-size:30px;font-weight:800;margin:10px 0 24px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.ov span{font-size:160px;animation:pop .35s}
/* bento */
.bento{position:relative;margin:4px auto 0;background:#fff;border:5px solid #c98b4a;border-radius:22px;padding:8px;box-shadow:0 5px 0 #a8703a}
.bento .cells{position:absolute;inset:8px;display:flex;pointer-events:none}
.bento .cell{flex:1;border-right:2px dashed #ead6bd}
.bento .cell:last-child{border-right:none}
.bento .lay{position:relative;display:flex;align-items:center;height:100%}
.bento .ghost{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;opacity:.28;filter:saturate(.7)}
.bento .ghost .blk{border-style:dashed}
.bento .gh{position:absolute;top:0;height:100%;border:3px dashed var(--c);border-radius:12px;opacity:.55;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.04) 6px 12px)}
.bento .gh.r{background:none}
.bento .pc{display:flex;gap:2px;cursor:pointer;position:relative;z-index:2}
.bento .pc .blk{transition:transform .15s}
.bn-note{display:flex;justify-content:center;min-height:40px;margin-top:8px}
.bn-note svg{max-height:min(80px,11vh);width:auto !important}
.bn-target{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:18px;padding:8px;box-shadow:0 3px 0 var(--line);margin-bottom:8px}
.bn-target svg{max-height:min(80px,11vh);width:auto !important}
.bn-msg{min-height:30px;text-align:center;font-size:20px;font-weight:800;margin-bottom:6px}
.bn-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.bn-pc{background:#fff;border:none;border-radius:18px;padding:8px 6px 10px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.bn-pc:active{transform:scale(.96)}
.bn-pc .w{font-size:15px;font-weight:800}
.bn-pc svg{max-width:100%;height:auto}
.bn-pc.no{opacity:.35}
.bn-pc.bad,.bento.bad{animation:shake .4s}
.bento.good{border-color:var(--c3);box-shadow:0 5px 0 #2f7d4c}
</style>
</head>
<body>
<header>
  <button id="backBtn" aria-label="もどる">←</button>
  <h1><span class="logo"><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i><i style="background:var(--c4)"></i></span>リズムチャレンジ</h1>
  <div id="stars">⭐ 0</div>
</header>

<!-- HOME -->
<section class="view on" id="v-home">
  <div class="tiles">
    <button class="tile" style="background:var(--c1)" data-go="list"><span class="em">🧱</span><span>つみきで おぼえよう<small>おんぷの ながさと ことば</small></span></button>
    <button class="tile" style="background:var(--c3)" data-go="nobashi"><span class="em">🎈</span><span>のばして あそぼう<small>ちょうどの ながさで ゆびを はなそう</small></span></button>
    <button class="tile" style="background:var(--c4)" data-go="quizSetup"><span class="em">❓</span><span>クイズ<small>きいて えらぶ・どっちが ながい</small></span></button>
    <button class="tile" style="background:#c98b4a" data-go="bento"><span class="em">🍱</span><span>おべんとうばこ<small>4マスに おかずを つめて リズムを つくろう</small></span></button>
    <button class="tile soon"><span class="em">🥁</span><span>リズムを たたこう<small>つくっているよ</small></span></button>
  </div>
  <div class="settings">
    <div class="row"><span class="lab">はやさ</span><div class="seg" id="setSpeed"><button data-v="72">ふつう</button><button data-v="56">ゆっくり</button></div></div>
    <div class="row"><span class="lab">こえ</span><div class="seg" id="setVoice"><button data-v="1">あり</button><button data-v="0">なし</button></div></div>
    <div class="row"><span class="lab">カチカチ</span><div class="seg" id="setClick"><button data-v="1">あり</button><button data-v="0">なし</button></div></div>
  </div>
</section>

<!-- LIST -->
<section class="view" id="v-list">
  <div class="chips" id="listChips"></div>
  <div class="grid" id="listGrid"></div>
</section>

<!-- DETAIL -->
<section class="view" id="v-detail"><div class="detail" id="detailBox"></div></section>

<!-- NOBASHI -->
<section class="view" id="v-nobashi">
  <div class="chips" id="nbChips" style="justify-content:center"></div>
  <div class="nb-top" id="nbTop"></div>
  <div class="nb-msg" id="nbMsg"></div>
  <div class="holdwrap"><button class="hold" id="holdBtn">ぎゅっ</button></div>
  <div class="opts">
    <button class="tog on" id="togHint"><span class="box"></span>ヒント</button>
    <button class="tog" id="togCount"><span class="box"></span>かぞえてから</button>
  </div>
</section>

<!-- BENTO -->
<section class="view" id="v-bento">
  <div class="row" style="justify-content:center;margin-bottom:8px">
    <div class="seg" id="bnMode"><button data-v="free">じゆう</button><button data-v="odai">おだい</button></div>
    <div class="seg" id="bnLv"><button data-v="shape">かたち</button><button data-v="score">がくふ</button><button data-v="ear">おと</button></div>
  </div>
  <div id="bnTarget"></div>
  <div class="bento" id="bnBox"></div>
  <div id="bnNote" class="bn-note"></div>
  <div class="btns dbtns" style="margin:8px 0 12px">
    <button class="bigbtn" id="bnPlay" style="background:var(--c3)">▶ よむ</button>
    <button class="bigbtn gray" id="bnUndo">↩もどす</button>
    <button class="bigbtn gray" id="bnClear">🗑けす</button>
    <button class="bigbtn" id="bnNext" style="display:none;background:var(--c4)">つぎ▶</button>
  </div>
  <div class="bn-msg" id="bnMsg"></div>
  <div class="chips" id="bnChips" style="justify-content:center"></div>
  <div class="bn-pal" id="bnPal"></div>
</section>

<!-- QUIZ SETUP -->
<section class="view" id="v-quizSetup">
  <div class="qtypes" id="qTypes">
    <button class="qtype on" data-t="listen"><span class="em">👂</span><span>きいて えらぼう<small>おとを きいて、おんぷを えらぶ（じが よめなくても できる）</small></span></button>
    <button class="qtype" data-t="longer"><span class="em">📏</span><span>どっちが ながい？<small>2つの おとを くらべる</small></span></button>
    <button class="qtype" data-t="word"><span class="em">🔤</span><span>ことばを えらぼう<small>おんぷを みて、ことばを えらぶ</small></span></button>
  </div>
  <div id="qOpts"></div>
  <div class="btns" style="margin-top:18px"><button class="bigbtn" id="qStart" style="background:var(--c3);font-size:24px;padding:16px 40px">はじめる ▶</button></div>
</section>

<!-- QUIZ PLAY -->
<section class="view" id="v-quizPlay"><div id="qBox"></div></section>

<div id="credit" style="display:none;text-align:center;color:var(--sub);font-size:12px;padding:10px 0 24px">こえ：VOICEVOX:ずんだもん</div>
<div class="ov" id="ov"></div>

<script>
/* ===================== data ===================== */
const N=(d,syl,r)=>({d,syl:Array.isArray(syl)?syl:[syl],r:!!r});
const T=(n,c)=>({d:1/n,syl:[c],r:false,tp:n});
const WORDS=[
  {id:'q',k:'tan',nk:'shibuonpu', g:1,emj:'🐕',nm:'しぶおんぷ',w:'たん',col:'var(--c1)',ev:[N(1,'たん')]},
  {id:'h',k:'tan2',nk:'nibuonpu', g:1,nm:'にぶおんぷ',w:'たんにー',col:'var(--c2)',ev:[N(2,['たん','にー'])]},
  {id:'dh',k:'tan3',nk:'futen-nibuonpu',g:1,nm:'ふてん にぶおんぷ',w:'たんにーさん',col:'var(--c3)',ev:[N(3,['たん','にー','さん'])]},
  {id:'w',k:'tan4',nk:'zenonpu', g:1,emj:'🐘',nm:'ぜんおんぷ',w:'たんにーさんしー',col:'var(--c4)',ev:[N(4,['たん','にー','さん','しー'])]},
  {id:'qr',k:'un',nk:'shibukyuufu', g:2,nm:'しぶきゅうふ',w:'うん',col:'var(--c1)',ev:[N(1,'うん',1)]},
  {id:'hr',k:'un2',nk:'nibukyuufu', g:2,nm:'にぶきゅうふ',w:'うんにー',col:'var(--c2)',ev:[N(2,['うん','にー'],1)]},
  {id:'dhr',k:'un3',nk:'futen-nibukyuufu',g:2,nm:'ふてん にぶきゅうふ',w:'うんにーさん',col:'var(--c3)',ev:[N(3,['うん','にー','さん'],1)]},
  {id:'wr',k:'un4',nk:'zenkyuufu', g:2,nm:'ぜんきゅうふ',w:'うんにーさんしー',col:'var(--c4)',ev:[N(4,['うん','にー','さん','しー'],1)]},
  {id:'ee',k:'taka',nk:'hachibu-2',g:3,emj:'🐿️🐿️',nm:'はちぶおんぷ 2つ',w:'タカ',col:'var(--c8)',ev:[N(.5,'タ'),N(.5,'カ')]},
  {id:'er',k:'tau',nk:'hachibu-kyuufu-ato',g:3,nm:'はちぶおんぷ と はちぶきゅうふ',w:'タウ',col:'var(--c8)',ev:[N(.5,'タ'),N(.5,'ウ',1)]},
  {id:'re',k:'uka',nk:'hachibu-kyuufu-mae',g:3,nm:'はちぶきゅうふ と はちぶおんぷ',w:'ウカ',col:'var(--c8)',ev:[N(.5,'ウ',1),N(.5,'カ')]},
  {nm:'じゅうろくぶおんぷ',id:'f1',k:'takoyaki',nk:'juurokubu',g:4,w:'たこやき',emj:'🐙',col:'var(--c16)',ev:[N(.25,'た'),N(.25,'こ'),N(.25,'や'),N(.25,'き')]},
  {nm:'じゅうろくぶおんぷ',id:'f2',k:'ramen',nk:'juurokubu',g:4,w:'ラーメン',emj:'🍜',col:'var(--c16)',ev:[N(.5,'ラー'),N(.25,'メ'),N(.25,'ン')]},
  {nm:'じゅうろくぶおんぷ',id:'f3',k:'steak',nk:'juurokubu',g:4,w:'ステーキ',emj:'🥩',col:'var(--c16)',ev:[N(.25,'ス'),N(.5,'テー'),N(.25,'キ')]},

let AC=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
function newSess(){const a=ac();const g=a.createGain();g.connect(a.destination);return g;}
function killSess(g){if(!g)return;try{const a=ac();g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(0,a.currentTime);setTimeout(()=>{try{g.disconnect()}catch(e){}},200)}catch(e){}}
function tone(t,dur,dest,f=523.25,vol=.28){
  const a=ac();const g=a.createGain();g.connect(dest||a.destination);
  const o=a.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(g);
  const o2=a.createOscillator();o2.type='sine';o2.frequency.value=f*2;const g2=a.createGain();g2.gain.value=.22;o2.connect(g2);g2.connect(g);
  dur=Math.max(dur,.08);const end=t+dur;const sus=Math.min(.25,dur*.5);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.linearRampToValueAtTime(vol*.65,t+sus);g.gain.setValueAtTime(vol*.65,end-.02);
  g.gain.linearRampToValueAtTime(.0001,end+.03);
  o.start(t);o2.start(t);o.stop(end+.06);o2.stop(end+.06);
}
function holdTone(){
  const a=ac();const t=a.currentTime;const g=a.createGain();g.connect(a.destination);
  const o=a.createOscillator();o.type='triangle';o.frequency.value=523.25;o.connect(g);
  const o2=a.createOscillator();o2.type='sine';o2.frequency.value=1046.5;const g2=a.createGain();g2.gain.value=.22;o2.connect(g2);g2.connect(g);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.012);g.gain.linearRampToValueAtTime(.2,t+.25);
  o.start(t);o2.start(t);
  return ()=>{const n=a.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(.0001,n+.04);o.stop(n+.06);o2.stop(n+.06);};
}
function click(t,acc,dest){
  const a=ac();const o=a.createOscillator();const g=a.createGain();o.type='sine';o.frequency.value=acc?1700:1150;
  o.connect(g);g.connect(dest||a.destination);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(acc?.32:.2,t+.003);
  g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.start(t);o.stop(t+.08);
}
function bell(t,dest){
  const a=ac();t=t||a.currentTime;[2093,3136].forEach((f,i)=>{const o=a.createOscillator();const g=a.createGain();o.type='sine';o.frequency.value=f;
  o.connect(g);g.connect(dest||a.destination);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(i?.06:.18,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.start(t);o.stop(t+1);});
}
function yay(){const a=ac();const t=a.currentTime;[523,659,784,1047].forEach((f,i)=>tone(t+i*.08,.14,null,f,.2));}
function buzz(){const a=ac();const t=a.currentTime;tone(t,.18,null,220,.22);tone(t+.2,.25,null,196,.22);}

function say(text){
  return new Promise(res=>{
    if(!S.voice||!window.speechSynthesis){res();return;}
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    try{

/* ===================== rendering ===================== */
function restSvg(d,x){
  const k='#2b2320';
  if(near(d,4))return `<rect x="${x-7}" y="30" width="14" height="5.5" fill="${k}"/>`;
  if(near(d,2)||near(d,3))return `<rect x="${x-7}" y="34.5" width="14" height="5.5" fill="${k}"/>`+(near(d,3)?`<circle cx="${x+12}" cy="35" r="2.4" fill="${k}"/>`:'');
  if(near(d,1))return `<path d="M${x-3},22 L${x+4},31 L${x-1.5},38 L${x+5},47 Q${x-5},43 ${x+1},55" fill="none" stroke="${k}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(near(d,.5))return `<circle cx="${x-3}" cy="34" r="3" fill="${k}"/><path d="M${x-3},36 Q${x+1},37 ${x+4},32 L${x-1},51" fill="none" stroke="${k}" stroke-width="2" stroke-linecap="round"/>`;
  return `<circle cx="${x-1}" cy="31" r="2.8" fill="${k}"/><path d="M${x-1},33 Q${x+3},34 ${x+6},29" fill="none" stroke="${k}" stroke-width="2"/>`+
    `<circle cx="${x-4}" cy="40" r="2.8" fill="${k}"/><path d="M${x-4},42 Q${x},43 ${x+3.5},38.5" fill="none" stroke="${k}" stroke-width="2"/>`+
    `<path d="M${x+6},29 L${x-1},55" fill="none" stroke="${k}" stroke-width="2" stroke-linecap="round"/>`;
}
function notation(ev,scale=1.6){
  const per={};let tt=0;ev.forEach(e=>{const b=Math.floor(tt+1e-6);per[b]=(per[b]||0)+1;tt+=e.d;});
  const BW=Math.max(46,Math.max(...Object.values(per))*21+8),PAD=14;let t=0;
  const it=ev.map(e=>{const o=Object.assign({},e,{t});t+=e.d;return o;});
  const W=PAD*2+t*BW+(t<1?10:0),HY=55,TOP=20,SX=6,K='#2b2320';
  const X=o=>it.length===1?W/2-3:PAD+o.t*BW+(o.d>=1?12:8);
  let s='';
  for(const y of [20,30,40,50,60])s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#a89a8f" stroke-width="1.2"/>`;
  const groups={};
  it.forEach(o=>{if(o.d<1){const b=Math.floor(o.t+1e-6);(groups[b]=groups[b]||[]).push(o);}});
  const solo=new Set();
  Object.values(groups).forEach(g=>{const n=g.filter(o=>!o.r);if(n.length===1)solo.add(n[0]);});
  it.forEach(o=>{
    const x=X(o);
    if(o.r){s+=restSvg(o.d,x);return;}
    const open=o.d>=2;
    s+=`<ellipse cx="${x}" cy="${HY}" rx="7" ry="5.2" transform="rotate(-22 ${x} ${HY})" fill="${open?'#fff':K}" stroke="${K}" stroke-width="${open?2.6:1}"/>`;
    if(o.d<4)s+=`<line x1="${x+SX}" y1="${HY-1}" x2="${x+SX}" y2="${TOP}" stroke="${K}" stroke-width="2"/>`;
    if(near(o.d,3)||near(o.d,.75))s+=`<circle cx="${x+13}" cy="${HY-2}" r="2.4" fill="${K}"/>`;
    if(solo.has(o)){const fl=near(o.d,.25)?2:1;for(let k=0;k<fl;k++){const y=TOP+k*8;
      s+=`<path d="M${x+SX},${y} q1,7 8,11 q4,4 1,11" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>`;}}
  });
  Object.values(groups).forEach(g=>{
    const n=g.filter(o=>!o.r);if(n.length<2)return;
    const x1=X(n[0])+SX-1,x2=X(n[n.length-1])+SX+1;
    s+=`<rect x="${x1}" y="${TOP}" width="${x2-x1}" height="5" fill="${K}"/>`;
    const is16=o=>o&&(near(o.d,.25)||o.tp);
    const adj=(a,b)=>is16(a)&&is16(b)&&near(a.t+a.d,b.t);
    n.forEach((o,k)=>{
      if(!is16(o))return;const x=X(o)+SX,nx=n[k+1],pv=n[k-1];
      if(adj(o,nx))s+=`<rect x="${x-1}" y="${TOP+8}" width="${X(nx)+SX-x+2}" height="5" fill="${K}"/>`;
      else if(!adj(pv,o)){const L=11,left=k===n.length-1;s+=`<rect x="${left?x-L:x-1}" y="${TOP+8}" width="${L+1}" height="5" fill="${K}"/>`;}
    });
    if(n[0].tp){const bx1=X(n[0])-4,bx2=X(n[n.length-1])+SX+4,mx=(bx1+bx2)/2;
      s+=`<path d="M${bx1},15 V9 H${mx-8} M${mx+8},9 H${bx2} V15" fill="none" stroke="${K}" stroke-width="1.4"/><text x="${mx}" y="13" text-anchor="middle" font-size="12" font-weight="700" fill="${K}" font-family="serif">${n[0].tp}</text>`;}
  });
  return `<svg viewBox="0 0 ${W} 72" overflow="visible" style="width:${Math.round(W*scale)}px;max-width:100%;height:auto;display:block">${s}</svg>`;
}
function blocks(w,u,cls=''){
  let h=`<div class="blocks ${cls}" style="--u:${u}px;--bh:${Math.round(Math.min(u,95)*.72)}px">`,t=0;
  w.ev.forEach(e=>{
    h+='<div class="ev">';
    if(e.d>=1){for(let k=0;k<e.d;k++)h+=blk(e,1,e.syl[k]||'',t+k,w);}
    else h+=blk(e,e.d,e.syl[0],t,w);
    h+='</div>';t+=e.d;
  });
  return h+'</div>';
}
function blk(e,d,label,t,w){return `<div class="blk${e.r?' rest':''}" data-t="${t}" style="--d:${d};--c:${w.col}">${label}</div>`;}
function unitFor(w,avail,max){return Math.floor(Math.min(max,(avail-12*w.ev.length)/len(w)));}

/* ===================== playback ===================== */
let timers=[],curSess=null;
function stopPlay(){timers.forEach(clearTimeout);timers=[];killSess(curSess);curSess=null;
  document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));}
function playWord(w,{el=null,clicks=S.click,onSyl=null}={}){
  stopPlay();
  const a=ac(),B=beat(),t0=a.currentTime+.1,sess=newSess();curSess=sess;
  let t=0;
  w.ev.forEach(e=>{if(!e.r)tone(t0+t*B,e.d*B*(e.d<1?.8:.93),sess);t+=e.d;});
  if(clicks)for(let b=0;b<Math.ceil(t-1e-6);b++)click(t0+b*B,b===0,sess);
  const off=(t0-a.currentTime)*1000;
  if(el){
    el.classList.add('playing');el.querySelectorAll('.blk').forEach(x=>x.classList.remove('on'));
    el.querySelectorAll('.blk').forEach(x=>{const tt=+x.dataset.t;
      timers.push(setTimeout(()=>{x.classList.add('on');onSyl&&onSyl(x.textContent,x);},off+tt*B*1000));});
    timers.push(setTimeout(()=>el.classList.remove('playing'),off+t*B*1000+700));
  }
  return off+t*B*1000;
}

  const u=Math.floor(Math.min(92,(availW())/(n+1)));
  let slots='';
  for(let k=0;k<n+1;k++){const lab=k<n?w.ev[0].syl[k]:'';slots+=`<div class="slot ${k<n?'tg':'extra'}" style="left:${k*u}px" data-k="${k}">${lab||'・'}</div>`;}
  $('#nbTop').innerHTML=`${notation(w.ev,n>=3?1.5:1.9)}
    <div class="track${NB.hint?' hint':''}" id="nbTrack" style="--u:${u}px;--c:${w.col};width:${(n+1)*u}px"><div class="fill" id="nbFill"></div>${slots}</div>`;
  $('#togHint').classList.toggle('on',NB.hint);$('#togCount').classList.toggle('on',NB.countIn);
  nbIdleMsg();
}
function nbIdleMsg(){
  const w=byId(NB.id);
  $('#nbMsg').innerHTML=NB.countIn?`スタートで かぞえるよ<small>「はい」の つぎで ぎゅっと おそう</small>`
    :`ぎゅっと おして のばそう<small>カチ カチ に あわせて「${w.w}」</small>`;
  const b=$('#holdBtn');b.className='hold';b.textContent=NB.countIn?'スタート':'ぎゅっ';
}
function nbReset(silent){
  cancelAnimationFrame(NB.raf);NB.timers.forEach(clearTimeout);NB.timers=[];
  if(NB.stopTone){NB.stopTone();NB.stopTone=null;}killSess(NB.sess);NB.sess=null;NB.state='idle';
  const tr=$('#nbTrack');if(tr){tr.classList.remove('reach');tr.querySelectorAll('.slot').forEach(s=>s.classList.remove('passed'));$('#nbFill').style.width='0';}
  if(!silent)nbIdleMsg();
}
$('#togHint').onclick=()=>{NB.hint=!NB.hint;nbReset(true);renderNobashi();};
$('#togCount').onclick=()=>{NB.countIn=!NB.countIn;nbReset(true);renderNobashi();};
const holdBtn=$('#holdBtn');
holdBtn.addEventListener('contextmenu',e=>e.preventDefault());
holdBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();try{holdBtn.setPointerCapture(e.pointerId)}catch(_){}
  const a=ac(),now=a.currentTime,B=beat();
  if(NB.state==='idle'||NB.state==='done'){
    nbReset(true);
    if(NB.countIn){startCount();return;}
    beginHold(now,now);return;
  }
  if(NB.state==='count'){
    if(now<NB.D-.5*B){$('#nbMsg').innerHTML='まだだよ<small>「はい」の つぎで おしてね</small>';return;}
    beginHold(now,NB.D);
  }
});
['pointerup','pointercancel'].forEach(t=>holdBtn.addEventListener(t,()=>{if(NB.state==='hold')nbFinish(ac().currentTime,false);}));

function startCount(){
  const a=ac(),B=beat(),t0=a.currentTime+.15,w=byId(NB.id),n=len(w);
  NB.state='count';NB.sess=newSess();
  for(let b=0;b<4;b++)click(t0+b*B,b===0,NB.sess);
  bell(t0+3*B,NB.sess);
  NB.D=t0+4*B;
  for(let b=0;b<n+2;b++)click(NB.D+b*B,b===0,NB.sess);
  const btn=$('#holdBtn');btn.className='hold count';btn.textContent='';
  $('#nbMsg').innerHTML='かぞえるよ<small>「はい」の つぎで おしてね</small>';
  const off=(t0-a.currentTime)*1000;
  ['1','2','3','はい'].forEach((x,i)=>NB.timers.push(setTimeout(()=>{if(NB.state!=='count')return;btn.textContent=x;
    btn.style.background=x==='はい'?'radial-gradient(circle at 35% 30%,#ff9a85,var(--c1))':'';},off+i*B*1000)));
  NB.timers.push(setTimeout(()=>{if(NB.state!=='count')return;btn.className='hold';btn.style.background='';btn.textContent='いま！';},off+4*B*1000));
  NB.timers.push(setTimeout(()=>{if(NB.state!=='count')return;nbReset(true);
    $('#nbMsg').innerHTML='あれれ？<small>「はい」の つぎで ぎゅっと おしてね。もういちど！</small>';
    const b=$('#holdBtn');b.className='hold';b.style.background='';b.textContent='スタート';},off+5.6*B*1000));
}
function beginHold(now,grid){
  const B=beat(),w=byId(NB.id),n=len(w);
  NB.timers.forEach(clearTimeout);NB.timers=[];
  NB.state='hold';NB.start=now;NB.grid=grid;NB.flag=false;NB.stopTone=holdTone();
  const btn=$('#holdBtn');btn.className='hold down';btn.style.background='';btn.textContent='';
  if(!NB.countIn){NB.sess=newSess();for(let b=0;b<n+2;b++)click(now+b*B,b===0,NB.sess);}
  $('#nbMsg').innerHTML='';
  const tr=$('#nbTrack'),fill=$('#nbFill'),u=parseFloat(tr.style.getPropertyValue('--u')),slots=[...tr.querySelectorAll('.slot')];
  let lastK=-1;
  const loop=()=>{
    if(NB.state!=='hold')return;
    const held=(ac().currentTime-NB.start)/B;
    fill.style.width=Math.min(held,n+1)*u+'px';
    const k=Math.floor(held);
    if(k!==lastK){lastK=k;slots.forEach((s,i)=>s.classList.toggle('passed',i<=k));
}
    if(NB.hint&&!NB.flag&&held>=n-.12){NB.flag=true;tr.classList.add('reach');$('#nbMsg').innerHTML='はなして！';}
    if(held>=n+1){nbFinish(ac().currentTime,true);return;}
    NB.raf=requestAnimationFrame(loop);
  };
  loop();
}
function nbFinish(now,auto){
  const B=beat(),w=byId(NB.id),n=len(w);
  NB.state='done';cancelAnimationFrame(NB.raf);
  if(NB.stopTone){NB.stopTone();NB.stopTone=null;}killSess(NB.sess);NB.sess=null;
  $('#nbTrack').classList.remove('reach');
  const held=(now-NB.start)/B,err=held-n,tol=n===1?.28:.33;
  let pressNote='';
  if(NB.countIn){const off=(NB.start-NB.grid)/B;
    pressNote=Math.abs(off)<=.3?'おすのも ぴったり！':off<0?'おすのが ちょっと はやかったよ':'おすのが ちょっと おそかったよ';}
  const btn=$('#holdBtn');btn.className='hold';btn.textContent=NB.countIn?'もういちど':'ぎゅっ';
  let t,sub,ok=false;
  if(auto||err>tol){t='ちょっと ながすぎたよ';sub=`「${w.ev[0].syl[n-1]}」の つぎで はなそう`;}
  else if(err<-tol){t='もうすこし ながーく！';sub=`「${w.w}」まで のばそう`;}
  else{t='ぴったり！ 🌟';sub=NB.hint?'つぎは ヒントなしで やってみよう':'すごい！ ヒントなしで できたね';ok=true;}
  if(pressNote)sub=pressNote+'　'+sub;
  $('#nbMsg').innerHTML=`${t}<small>${sub}</small>`;
  if(ok){yay();addStar(NB.hint?1:2);P('pittari');}else{P(err<0?'mousukoshi':'nagasugi');}
}

/* ===================== bento (1小節パズル) ===================== */
const BN={mode:'free',lv:'shape',tab:1,items:[],target:null,done:false,cap:4};
const bnLen=()=>BN.items.reduce((a,w)=>a+len(w),0);
function bnPool(){
  const g=new Set([1,BN.tab]);
  return WORDS.filter(w=>g.has(w.g)&&!(w.g===2&&len(w)>2&&BN.tab!==2));
}
function bnMakeTarget(){
  const base=bnPool();const pool=base.concat(base.filter(w=>w.g===1));let rem=BN.cap,out=[],guard=0;
  while(rem>1e-6&&guard++<50){
    const ok=pool.filter(w=>len(w)<=rem+1e-6&&!(out.length===0&&len(w)>=BN.cap&&Math.random()<.7));
    const c=(ok.length?ok:pool.filter(w=>len(w)<=rem+1e-6));
    const w=c[Math.random()*c.length|0];out.push(w);rem-=len(w);
  }
  if(out.every(w=>w.ev.every(e=>e.r)))return bnMakeTarget();
  return out;
}
function renderBento(){
  ['#bnMode','#bnLv'].forEach((id,i)=>{const key=i?'lv':'mode';
    $(id).querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.v===BN[key]);
      b.onclick=()=>{ac();BN[key]=b.dataset.v;BN.items=[];BN.done=false;BN.target=BN.mode==='odai'?bnMakeTarget():null;renderBento();if(BN.mode==='odai')bnIntro();};});});
  $('#bnLv').style.display=BN.mode==='odai'?'inline-flex':'none';
  if(BN.mode==='odai'&&!BN.target)BN.target=bnMakeTarget();
  $('#bnChips').innerHTML=GROUPS.filter(g=>g.g!==1).map(g=>`<button class="chip${g.g===BN.tab?' on':''}" data-g="${g.g}">${g.g===2?'のばす＋おやすみ':g.g===3?'のばす＋はんぶん':'のばす＋たべもの'}</button>`).join('');
  $('#bnChips').innerHTML=`<button class="chip${BN.tab===1?' on':''}" data-g="1">のばす おと</button>`+$('#bnChips').innerHTML;
  $('#bnChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{BN.tab=+c.dataset.g;BN.items=[];BN.done=false;BN.target=BN.mode==='odai'?bnMakeTarget():null;renderBento();});
  bnDrawTarget();bnDrawBox();bnDrawPal();
  $('#bnNext').style.display=BN.mode==='odai'?'':'none';
  if(!BN.done)$('#bnMsg').textContent=BN.mode==='free'?'おかずを タップして つめよう':'おだいと おなじに つめよう';
}
function bnIntro(){if(BN.lv==='ear'&&BN.target)setTimeout(()=>bnPlayTarget(),300);}
function bnDrawTarget(){
  const el=$('#bnTarget');
  if(BN.mode!=='odai'){el.innerHTML='';return;}
  const ev=BN.target.flatMap(w=>w.ev);
  if(BN.lv==='score')el.innerHTML=`<div class="bn-target"><div class="hint" style="margin:0">この リズムを つくろう</div>${notation(ev,1.6)}</div>`;
  else if(BN.lv==='ear')el.innerHTML=`<div class="bn-target"><button class="bigbtn" id="bnHear">🔊 おだいを きく</button></div>`;
  else el.innerHTML=`<div class="hint" style="text-align:center;margin:0 0 6px">おなじ かたちの おかずを いれよう</div>`;
  const h=$('#bnHear');if(h)h.onclick=bnPlayTarget;
}
function bnPlayTarget(){playWord({ev:BN.target.flatMap(w=>w.ev)},{clicks:true});}
function bnUnit(){return Math.floor(Math.min(92,(availW()-30)/BN.cap));}
function bnDrawBox(){
  const u=bnUnit(),bh=Math.round(Math.min(u,95)*.72);
  let ghosts='';
  if(BN.mode==='odai'&&BN.lv==='shape'){let t=0,g='';BN.target.forEach(w=>{let inner='';
    w.ev.forEach(e=>{if(e.d>=1){for(let k=0;k<e.d;k++)inner+=blk(e,1,'',t+k,w);}else inner+=blk(e,e.d,'',t,w);t+=e.d;});
    g+=`<div class="pc" style="margin-right:2px">${inner}</div>`;});
    ghosts=`<div class="ghost">${g}</div>`;}
  let pcs='',t=0;
  BN.items.forEach((w,i)=>{
    let inner='';let tt=t;
    w.ev.forEach(e=>{if(e.d>=1){for(let k=0;k<e.d;k++)inner+=blk(e,1,e.syl[k]||'',tt+k,w);}else inner+=blk(e,e.d,e.syl[0],tt,w);tt+=e.d;});
    pcs+=`<div class="pc" data-i="${i}" style="margin-right:2px">${inner}</div>`;t+=len(w);
  });
  let cells='';for(let k=0;k<BN.cap;k++)cells+='<div class="cell"></div>';
  $('#bnBox').className='bento'+(BN.done?' good':'');
  $('#bnBox').style.width=(BN.cap*u+26)+'px';
  $('#bnBox').innerHTML=`<div class="cells">${cells}</div><div class="lay blocks" style="--u:${u}px;--bh:${bh}px;height:${bh+8}px;justify-content:flex-start">${ghosts}${pcs}</div>`;
  $('#bnBox').querySelectorAll('.pc').forEach(p=>p.onclick=()=>{if(BN.done&&BN.mode==='odai')return;BN.items.splice(+p.dataset.i,1);BN.done=false;bnDrawBox();bnDrawPal();bnDrawNote();$('#bnMsg').textContent='';});
  bnDrawNote();
}
function bnDrawNote(){
  const ev=BN.items.flatMap(w=>w.ev);
  $('#bnNote').innerHTML=ev.length?notation(ev,1.4):'';
}
function bnDrawPal(){
  const rem=BN.cap-bnLen();
  const ws=BN.tab===1?WORDS.filter(w=>w.g===1):WORDS.filter(w=>w.g===1||w.g===BN.tab);
  $('#bnPal').innerHTML=ws.map(w=>`<button class="bn-pc${len(w)>rem+1e-6?' no':''}" data-id="${w.id}">
      ${notation(w.ev,len(w)<1?1.2:.9)}${blocks(w,Math.min(22,Math.floor(80/len(w))),'nolabel')}<div class="w">${w.w}</div></button>`).join('');
  $('#bnPal').querySelectorAll('.bn-pc').forEach(b=>b.onclick=()=>bnAdd(byId(b.dataset.id),b));
}
function bnShake(el){el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');}
function bnAdd(w,btn){
  ac();if(BN.done)return;
  const rem=BN.cap-bnLen();
  if(len(w)>rem+1e-6){bnShake(btn);buzz();$('#bnMsg').textContent='はいらないよ！ ながすぎるね';say('はいらないよ');return;}
  if(BN.mode==='odai'&&BN.lv==='shape'){
    const nx=BN.target[BN.items.length];
    if(!nx||!sameSound(nx,w)){bnShake(btn);buzz();$('#bnMsg').textContent='かたちが ちがうよ';return;}
  }
  BN.items.push(w);
  speak('koe-'+w.k,w.w);
  bnDrawBox();bnDrawPal();
  $('#bnMsg').textContent='';
  if(bnLen()>=BN.cap-1e-6)setTimeout(bnFull,450);
}
function bnSeq(){return BN.items.flatMap(w=>w.ev).map(e=>[Math.round(e.d*1000),e.r]);}
async function bnFull(){
  if(BN.mode==='free'){
    $('#bnMsg').textContent='できた！ よんでみるよ';await wait(200);bnRead();return;
  }
  const ok=JSON.stringify(bnSeq())===JSON.stringify(BN.target.flatMap(w=>w.ev).map(e=>[Math.round(e.d*1000),e.r]));
  if(ok){BN.done=true;bnDrawBox();yay();addStar(BN.lv==='shape'?1:2);flash('⭕');$('#bnMsg').textContent='せいかい！ おいしそう！';
    await wait(900);bnRead();}
  else{bnShake($('#bnBox'));buzz();$('#bnMsg').textContent='おだいと ちがうところが あるよ。おかずを タップして とりだそう';
    if(BN.lv==='ear'){await wait(800);bnPlayTarget();}}
}
function bnRead(){
  if(!BN.items.length)return;
  const lay=$('#bnBox .lay');
  playWord({ev:BN.items.flatMap(w=>w.ev)},{el:lay,clicks:S.click});
}
$('#bnPlay').onclick=()=>{ac();bnRead();};
$('#bnUndo').onclick=()=>{if(BN.done&&BN.mode==='odai')return;BN.items.pop();BN.done=false;bnDrawBox();bnDrawPal();$('#bnMsg').textContent='';};
$('#bnClear').onclick=()=>{if(BN.done&&BN.mode==='odai')return;BN.items=[];BN.done=false;bnDrawBox();bnDrawPal();$('#bnMsg').textContent='';};
$('#bnNext').onclick=()=>{ac();BN.items=[];BN.done=false;BN.target=bnMakeTarget();renderBento();bnIntro();};

/* ===================== quiz ===================== */
const QZ={type:'listen',groups:new Set([1]),choices:2,show:true,i:0,total:5,score:0,alive:false,lock:false,prev:null};
function renderQuizSetup(){
  $('#qTypes').querySelectorAll('.qtype').forEach(b=>{b.classList.toggle('on',b.dataset.t===QZ.type);
    b.onclick=()=>{QZ.type=b.dataset.t;renderQuizSetup();};});
  let h='';
  if(QZ.type!=='longer'){
    h+=`<div class="hint">どの なかまで あそぶ？（いくつでも）</div><div class="chips" id="qGroups">`+
      GROUPS.map(g=>`<button class="chip${QZ.groups.has(g.g)?' on':''}" data-g="${g.g}">${g.name}</button>`).join('')+'</div>';
    h+=`<div class="row" style="margin-bottom:10px"><span class="lab">えらぶ かず</span><div class="seg" id="qN">
      <button data-v="2" class="${QZ.choices===2?'on':''}">2つ</button><button data-v="3" class="${QZ.choices===3?'on':''}">3つ</button></div></div>`;
  }else h+=`<div class="hint">「のばす おと」（たん〜たんにーさんしー）で くらべるよ</div>`;
  if(QZ.type!=='word')h+=`<button class="tog${QZ.show?' on':''}" id="qShow"><span class="box"></span>つみきを みせる</button>`;
  if(QZ.type==='listen'&&QZ.groups.has(2)&&QZ.groups.size===1)h+=`<div class="hint" style="color:var(--c1)">「おやすみ」だけだと おとが ならないので、ほかの なかまも えらんでね</div>`;
  $('#qOpts').innerHTML=h;
  $('#qOpts').querySelectorAll('#qGroups .chip').forEach(c=>c.onclick=()=>{const g=+c.dataset.g;
    if(QZ.groups.has(g)){if(QZ.groups.size>1)QZ.groups.delete(g);}else QZ.groups.add(g);renderQuizSetup();});
  $('#qOpts').querySelectorAll('#qN button').forEach(b=>b.onclick=()=>{QZ.choices=+b.dataset.v;renderQuizSetup();});
  const qs=$('#qShow');if(qs)qs.onclick=()=>{QZ.show=!QZ.show;renderQuizSetup();};
}
$('#qStart').onclick=()=>{ac();if(window.speechSynthesis)try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  go('quizPlay');QZ.i=0;QZ.score=0;QZ.alive=true;QZ.prev=null;nextQ();};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const sameSound=(a,b)=>JSON.stringify(a.ev.map(e=>[e.d,e.r]))===JSON.stringify(b.ev.map(e=>[e.d,e.r]));
function pool(){
  if(QZ.type==='longer')return WORDS.filter(w=>w.g===1);
  let p=WORDS.filter(w=>QZ.groups.has(w.g));
  if(QZ.type==='listen'){const q=p.filter(w=>w.ev.some(e=>!e.r));if(q.length>=2)p=q;}
  return p;
}
function pickChoices(ans,k){
  let others=shuffle(pool().filter(w=>w!==ans&&!sameSound(w,ans)));
  if(others.length<k-1)others=others.concat(shuffle(WORDS.filter(w=>w!==ans&&!others.includes(w)&&w.g!==2)));
  return shuffle([ans].concat(others.slice(0,k-1)));
}
function progHTML(){let h='<div class="qprog">';for(let i=0;i<QZ.total;i++)h+=`<i class="${i<QZ.i?'done':i===QZ.i?'now':''}"></i>`;return h+'</div>';}
function choiceCard(w,mode){
  const inner=mode==='word'?`<div class="w">${w.w}</div>`:
    `${QZ.show?pic(w,'qemj','font-size:28px'):''}${notation(w.ev,len(w)<1?1.6:1.15)}${QZ.show?blocks(w,Math.min(34,Math.floor(130/len(w))),'nolabel'):''}`;
  return `<button class="qchoice" data-id="${w.id}">${inner}</button>`;
}
async function nextQ(){
  if(!QZ.alive)return;
  if(QZ.i>=QZ.total){showResult();return;}
  QZ.lock=true;const box=$('#qBox');
  if(QZ.type==='listen'){
    const p=pool();let ans;do{ans=p[Math.random()*p.length|0];}while(p.length>1&&ans===QZ.prev);QZ.prev=ans;
    const ch=pickChoices(ans,QZ.choices);QZ.ans=ans;
    box.innerHTML=progHTML()+`<div class="qprompt">どの おとかな？</div>
      <div class="btns" style="margin-bottom:14px"><button class="bigbtn" id="qReplay" style="font-size:26px">🔊 もういちど きく</button></div>
      <div class="qchoices">${ch.map(w=>choiceCard(w,'listen')).join('')}</div>`;
    $('#qReplay').onclick=()=>playWord(ans,{clicks:true});
    bindChoices(w=>w===ans||sameSound(w,ans));
    await P('dono');if(!QZ.alive)return;
    await wait(playWord(ans,{clicks:true}));QZ.lock=false;
  }else if(QZ.type==='longer'){
    const p=shuffle(pool()),A=p[0],Bw=p[1],askLong=Math.random()<.65;QZ.prev=null;
    QZ.ans=askLong?(len(A)>len(Bw)?A:Bw):(len(A)<len(Bw)?A:Bw);
    box.innerHTML=progHTML()+`<div class="qprompt">${askLong?'ながいのは どっち？':'みじかいのは どっち？'}</div>
      <div class="btns" style="margin-bottom:14px"><button class="bigbtn" id="qReplay" style="font-size:24px">🔊 もういちど きく</button></div>
      <div class="qchoices" style="grid-template-columns:1fr 1fr">${[A,Bw].map(w=>choiceCard(w,'longer')).join('')}</div>`;
    const cards=[...box.querySelectorAll('.qchoice')];
    const playBoth=async()=>{QZ.lock=true;for(let i=0;i<2;i++){if(!QZ.alive)return;cards.forEach(c=>c.classList.remove('lit'));cards[i].classList.add('lit');
      await wait(playWord([A,Bw][i],{clicks:true,el:QZ.show?cards[i].querySelector('.blocks'):null}));await wait(350);}
      cards.forEach(c=>c.classList.remove('lit'));QZ.lock=false;};
    $('#qReplay').onclick=playBoth;
    bindChoices(w=>w===QZ.ans);
    await P(askLong?'nagai':'mijikai');if(!QZ.alive)return;await playBoth();
  }else{
    const p=pool();let ans;do{ans=p[Math.random()*p.length|0];}while(p.length>1&&ans===QZ.prev);QZ.prev=ans;QZ.ans=ans;
    const ch=pickChoices(ans,Math.max(3,QZ.choices));
    box.innerHTML=progHTML()+`<div class="qprompt">なんて いうかな？</div>
      <div class="qnote">${notation(ans.ev,len(ans)<1?3:2)}</div>
      <div class="qchoices">${ch.map(w=>choiceCard(w,'word')).join('')}</div>`;
    bindChoices(w=>w===ans,true);QZ.lock=false;
  }
}
function bindChoices(isRight,speakChoice){
  $('#qBox').querySelectorAll('.qchoice').forEach(c=>c.onclick=async()=>{
    if(QZ.lock||!QZ.alive)return;const w=byId(c.dataset.id);
    if(isRight(w)){
      QZ.lock=true;c.classList.add('good');yay();QZ.score++;addStar();flash('⭕');
      if(speakChoice)speak('koe-'+w.k,w.w);
      await wait(1300);QZ.i++;nextQ();
    }else{
      c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');buzz();
      if(speakChoice)speak('koe-'+w.k,w.w);
      if(QZ.type==='listen'){QZ.lock=true;await wait(700);if(!QZ.alive)return;await wait(playWord(QZ.ans,{clicks:true}));QZ.lock=false;}
    }
  });
}
function flash(t){const o=$('#ov');o.innerHTML=`<span>${t}</span>`;setTimeout(()=>o.innerHTML='',800);}
function showResult(){
  QZ.alive=false;const all=QZ.score===QZ.total;
  $('#qBox').innerHTML=`<div class="result"><div class="big">${'⭐'.repeat(QZ.score)||'🌱'}</div>
    <div class="t">${all?'ぜんぶ できたね！':'よく がんばったね！'}</div>
    <div class="btns"><button class="bigbtn" id="qAgain" style="background:var(--c3)">もういちど</button>
    <button class="bigbtn gray" id="qEnd">おわり</button></div></div>`;
  yay();P(all?'zenbu':'ganbatta');
  $('#qAgain').onclick=()=>{QZ.i=0;QZ.score=0;QZ.alive=true;nextQ();};
  $('#qEnd').onclick=()=>go('home');
}
probeFiles();
if(window.speechSynthesis){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}}
</script>
