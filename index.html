<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>リズムカード学習アプリ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 20px 10px;
    }
    .active { display: flex; }

    .menu-title { font-size: 24px; color: #333; margin-top: 20px; }
    .level-list { width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; }
    .level-btn {
      background: #ffffff;
      border: 3px solid #4ea8de;
      padding: 15px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .header h1 { font-size: 20px; color: #333; margin: 0; text-align: center; }
    .swiper-container { width: 100%; height: 50vh; display: flex; align-items: center; justify-content: center; }
    .card-container { width: 85vw; max-width: 320px; height: 100%; max-height: 380px; perspective: 1000px; cursor: pointer; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.12); border-radius: 24px; }
    .card-container.flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; background: #ffffff; display: flex; align-items: center; justify-content: center; border: 4px solid #e2e8f0; box-sizing: border-box; }
    .card-back { transform: rotateY(180deg); }
    .card-img { width: 85%; height: 85%; object-fit: contain; }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-15px); }
      40% { transform: translateX(15px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
    .shake { animation: shake 0.4s ease; }

    .overlay {
      position: absolute;
      font-size: 120px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .overlay.correct { color: #2ed573; opacity: 1; }
    .overlay.wrong { color: #ff4757; opacity: 1; }

    .btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.95); background: #ff4757; }
    .btn-menu { background: #a4b0be; margin-top: 5px; }

    .debug-box {
      font-size: 15px;
      font-weight: bold;
      color: #2d3748;
      background: #edf2f7;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 5px;
      min-height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 1. メニュー画面 -->
  <div id="screenMenu" class="screen active">
    <h1 class="menu-title">リズムのおんがく</h1>
    <div class="level-list">
      <div class="level-btn" onclick="startLevel1()">
        <span>Lv.1 おんぷのお名前</span>
        <span>🔓</span>
      </div>
      <div class="level-btn" style="opacity: 0.5;">
        <span>Lv.2 おんぷの長さ</span>
        <span>🔒</span>
      </div>
      <div class="level-btn" style="opacity: 0.5;">
        <span>Lv.3 くちリズム</span>
        <span>🔒</span>
      </div>
    </div>
    <div></div>
  </div>

  <!-- 2. レベル1 練習モード -->
  <div id="screenPractice" class="screen">
    <div class="header">
      <h1>Lv.1 れんしゅう</h1>
      <p style="font-size: 12px; color: #666; margin: 3px 0 0;">スワイプでめくる / タップで答え</p>
    </div>
    <div class="swiper-container" id="swipeArea">
      <div class="card-container" id="cardContainer" onclick="flipCard()">
        <div class="card-inner" id="cardInner">
          <div class="card-front"><img id="imgFront" class="card-img" src="" alt="おもて"></div>
          <div class="card-back"><img id="imgBack" class="card-img" src="" alt="うら"></div>
        </div>
      </div>
    </div>
    <div style="text-align: center;">
      <button class="btn" onclick="startTraining()">🎤 トレーニングへ</button><br>
      <button class="btn btn-menu" onclick="showMenu()">メニューへもどる</button>
    </div>
  </div>

  <!-- 3. レベル1 トレーニングモード -->
  <div id="screenTraining" class="screen">
    <div class="header">
      <h1>Lv.1 トレーニング</h1>
      <p id="quizPrompt" style="font-size: 14px; color: #333; margin: 3px 0 0;">カードをタップすると「いちじていし」できるよ！</p>
      <div id="debugBox" class="debug-box">きいています...</div>
    </div>
    <div class="swiper-container" style="position: relative;">
      <div class="card-container" id="quizCardContainer" onclick="togglePause()">
        <div class="card-inner" id="quizCardInner">
          <div class="card-front"><img id="quizImg" class="card-img" src="" alt="問題"></div>
        </div>
      </div>
      <div id="markOverlay" class="overlay"></div>
    </div>
    <div style="text-align: center;">
      <button id="pauseBtn" class="btn" style="background:#e2e8f0; color:#333;" onclick="togglePause()">⏸️ いちじていし</button><br>
      <button class="btn btn-menu" onclick="stopTrainingAndGoMenu()">おわる</button>
    </div>
  </div>

  <script>
    // 正解キーワードをすべて「ひらがな」基準で登録
    const cards = [
      { hiraganaAnswers: ['しぶおんぷ', 'しぶんおんぷ', 'しぶ', 'しぶん'], front: 'onpu5-4bu1.png', back: 'onpu5-4bu2.png' },
      { hiraganaAnswers: ['にぶおんぷ', 'にぶんおんぷ', 'にぶ', 'にぶん'], front: 'onpu3-2bu1.png', back: 'onpu3-2bu2.png' },
      { hiraganaAnswers: ['ぜんおんぷ', 'ぜん'], front: 'onpu1-zen1.png', back: 'onpu1-zen2.png' },
      { hiraganaAnswers: ['はちぶおんぷ', 'はちぶんおんぷ', 'はちぶ', 'はちぶん'], front: 'onpu7-8bu1.png', back: 'onpu7-8bu2.png' },
      { hiraganaAnswers: ['じゅうろくぶおんぷ', 'じゅうろくぶんおんぷ', 'じゅうろくぶ', 'じゅうろくぶん'], front: 'onpu10-16bu1.png', back: 'onpu10-16bu2.png' },
      { hiraganaAnswers: ['ぜんきゅうふ', 'ぜん'], front: 'kyuufu1-zen1.png', back: 'kyuufu1-zen2.png' },
      { hiraganaAnswers: ['にぶきゅうふ', 'にぶんきゅうふ', 'にぶ', 'にぶん'], front: 'kyuufu3-2bu1.png', back: 'kyuufu3-2bu2.png' },
      { hiraganaAnswers: ['しぶきゅうふ', 'しぶんきゅうふ', 'しぶ', 'しぶん'], front: 'kyuufu5-4bu1.png', back: 'kyuufu5-4bu2.png' },
      { hiraganaAnswers: ['はちぶきゅうふ', 'はちぶんきゅうふ', 'はちぶ', 'はちぶん'], front: 'kyuufu7-8bu1.png', back: 'kyuufu7-8bu2.png' },
      { hiraganaAnswers: ['じゅうろくぶきゅうふ', 'じゅうろくぶんきゅうふ', 'じゅうろくぶ', 'じゅうろくぶん'], front: 'kyuufu9-16bu1.png', back: 'kyuufu9-16bu3.png' }
    ];

    let currentIndex = 0;
    let quizIndex = 0;
    let recognition = null;
    let isPaused = false;
    let nextTimer = null;
    let isTrainingActive = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'tap') {
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'correct') {
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function showScreen(id) {
      playSound('tap');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showMenu() {
      isTrainingActive = false;
      if (recognition) recognition.abort();
      showScreen('screenMenu');
    }

    function startLevel1() { showScreen('screenPractice'); updatePracticeCard(); }

    function updatePracticeCard() {
      const container = document.getElementById('cardContainer');
      container.classList.remove('flipped');
      setTimeout(() => {
        document.getElementById('imgFront').src = cards[currentIndex].front;
        document.getElementById('imgBack').src = cards[currentIndex].back;
      }, 150);
    }
    function flipCard() { playSound('tap'); document.getElementById('cardContainer').classList.toggle('flipped'); }

    let startX = 0;
    const swipeArea = document.getElementById('swipeArea');
    swipeArea.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
    swipeArea.addEventListener('touchend', e => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) {
        currentIndex = diff > 0 ? (currentIndex + 1) % cards.length : (currentIndex - 1 + cards.length) % cards.length;
        updatePracticeCard();
      }
    });

    // 認識されたテキスト（漢字・数字・誤変換）をひらがなに一括変換
    function normalizeToHiragana(text) {
      return text
        .replace(/4|四/g, 'し')
        .replace(/2|二/g, 'に')
        .replace(/8|八/g, 'はち')
        .replace(/16|十六/g, 'じゅうろく')
        .replace(/分|部|支部|市部|私部/g, 'ぶ')
        .replace(/全/g, 'ぜん')
        .replace(/給付|休符/g, 'きゅうふ')
        .replace(/音符/g, 'おんぷ');
    }

    function startTraining() {
      isTrainingActive = true;
      isPaused = false;
      document.getElementById('pauseBtn').innerText = "⏸️ いちじていし";
      showScreen('screenTraining');
      nextQuestion();
    }

    function nextQuestion() {
      if (!isTrainingActive || isPaused) return;

      quizIndex = Math.floor(Math.random() * cards.length);
      document.getElementById('quizImg').src = cards[quizIndex].front;
      document.getElementById('debugBox').innerText = "きいています...（お話ししてね）";
      
      startListening();
    }

    function startListening() {
      if (!isTrainingActive || isPaused) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("お使いのブラウザは音声認識に対応していません");
        return;
      }

      if (recognition) recognition.abort();
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';

      recognition.onresult = (e) => {
        if (isPaused) return;
        const rawText = e.results[0][0].transcript;
        const normalizedText = normalizeToHiragana(rawText);
        const validAnswers = cards[quizIndex].hiraganaAnswers;

        document.getElementById('debugBox').innerText = `あなたのこたえ: 「${normalizedText}」`;

        // ひらがな同士で判定
        const isCorrect = validAnswers.some(answer => normalizedText.includes(answer));
        showResult(isCorrect);
      };

      recognition.onerror = () => {
        if (!isPaused && isTrainingActive) {
          document.getElementById('debugBox').innerText = "もういちど お話ししてね！";
          setTimeout(startListening, 1000);
        }
      };

      recognition.start();
    }

    function showResult(isCorrect) {
      const overlay = document.getElementById('markOverlay');
      const cardInner = document.getElementById('quizCardInner');

      if (isCorrect) {
        overlay.innerText = '⭕️';
        overlay.className = 'overlay correct';
        playSound('correct');
      } else {
        overlay.innerText = '❌';
        overlay.className = 'overlay wrong';
        cardInner.classList.add('shake');
        playSound('wrong');
      }

      nextTimer = setTimeout(() => {
        overlay.className = 'overlay';
        cardInner.classList.remove('shake');
        if (!isPaused && isTrainingActive) {
          nextQuestion();
        }
      }, 3000);
    }

    function togglePause() {
      playSound('tap');
      isPaused = !isPaused;
      const pauseBtn = document.getElementById('pauseBtn');

      if (isPaused) {
        if (recognition) recognition.abort();
        clearTimeout(nextTimer);
        pauseBtn.innerText = "▶️ つづける";
        document.getElementById('debugBox').innerText = "⏸️ いちじていし中（ゆっくりかくにんしてね）";
      } else {
        pauseBtn.innerText = "⏸️ いちじていし";
        nextQuestion();
      }
    }

    function stopTrainingAndGoMenu() {
      isTrainingActive = false;
      isPaused = false;
      clearTimeout(nextTimer);
      if (recognition) recognition.abort();
      showMenu();
    }
  </script>
</body>
</html>
